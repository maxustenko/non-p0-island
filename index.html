<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Non-P0 island: a Desert Island ice breaker you can play together from any device.">
<title>Non-P0 island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#0e7c8f; --sea-deep:#0a5566; --sand:#f6dfa4; --sand-d:#e7c47a; --sun:#ffb938;
  --ink:#16323a; --card:#fffaf0; --muted:#5d7479;
  --survival:#e4572e; --tools:#3a86c8; --comfort:#9b5de5; --personal:#2a9d6f;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Nunito,system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#8fd3e8 0%,#bfe8f0 45%,#e9f7f4 100%);
  min-height:100vh;overflow-x:hidden;
}
h1,h2,h3,.fd{font-family:Fredoka,Nunito,sans-serif}
button{font-family:Fredoka,sans-serif;cursor:pointer;border:none}
.wrap{max-width:1040px;margin:0 auto;padding:20px 18px 60px;position:relative;z-index:2}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.logo{font-family:Fredoka;font-weight:700;font-size:26px;letter-spacing:.5px;color:var(--sea-deep);display:flex;align-items:center;gap:8px}
.logo span.o{color:var(--sun);text-shadow:0 2px 0 #c97f00}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper div{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.55);color:var(--muted)}
.stepper div.on{background:var(--sea-deep);color:#fff}
.panel{background:var(--card);border-radius:24px;padding:26px;box-shadow:0 10px 30px rgba(10,85,102,.18),0 2px 0 rgba(0,0,0,.04);animation:pop .35s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.btn{background:var(--sun);color:#3d2600;font-weight:600;font-size:18px;padding:13px 26px;border-radius:99px;box-shadow:0 4px 0 #c97f00;transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c97f00}
.btn.sec{background:#fff;color:var(--sea-deep);box-shadow:0 4px 0 #9cc9d1}
.btn.sm{font-size:15px;padding:9px 16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.muted{color:var(--muted)}
.hero h1{font-size:clamp(40px,8vw,76px);margin:6px 0 4px;color:var(--sea-deep);line-height:1}
.hero h1 .o{color:var(--sun);text-shadow:0 3px 0 #c97f00}
.hero p.lead{font-size:20px;max-width:620px;margin:10px auto 22px}
.island{width:100%;max-width:720px;display:block;margin:0 auto}
.facts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 22px}
.chip{background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
input[type=text],textarea,select{font:inherit;padding:11px 14px;border-radius:12px;border:2px solid #d6e6e8;background:#fff;color:var(--ink);width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--sea)}
.players{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.ptag{background:#e3f4f6;border-radius:99px;padding:6px 8px 6px 14px;font-weight:700;display:flex;align-items:center;gap:6px}
.ptag button{background:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.mode{border:3px solid #d6e6e8;border-radius:var(--radius);padding:16px;cursor:pointer;background:#fff;transition:.15s}
.mode.on{border-color:var(--sea);background:#eefafb}
.mode h3{margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:#fff;border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;border:3px solid transparent;position:relative;transition:.12s;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.item:hover{transform:translateY(-3px)}
.item .em{font-size:38px;line-height:1.1}
.item .nm{font-weight:700;font-size:14px;margin-top:4px}
.item .cat{position:absolute;top:8px;left:8px;width:10px;height:10px;border-radius:50%}
.item.on{border-color:var(--sun);background:#fff6df}
.item.on::after{content:"✓";position:absolute;top:4px;right:8px;font-weight:800;color:#c97f00}
.item.dim{opacity:.4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;margin:8px 0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.timer{font-family:Fredoka;font-size:clamp(60px,14vw,120px);font-weight:700;color:var(--sea-deep);line-height:1}
.ring{width:220px;height:220px;margin:0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .timer{position:absolute;inset:0;display:grid;place-items:center;font-size:56px}
.hint{background:#fff;border-left:6px solid var(--sun);padding:12px 16px;border-radius:12px;font-weight:600;margin:14px auto;max-width:560px;min-height:52px}
.turnhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.turnhead h2{margin:0;font-size:30px}
.progress{font-weight:700;color:var(--muted)}
.picked{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.slot{border:3px dashed #c7dfe2;border-radius:16px;min-height:120px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.slot.full{border-style:solid;border-color:var(--sun)}
.slot .em{font-size:40px}
.slot input{margin-top:6px;font-size:14px;padding:7px 10px}
.custom{display:grid;grid-template-columns:1fr 160px auto;gap:8px;margin-top:10px}
.beach{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#7fd0e6 0%,#bfeaf2 55%,var(--sand) 55%,var(--sand-d) 100%);height:300px;margin:14px 0}
.beach .crate{position:absolute;bottom:26px;width:30%;text-align:center;animation:wash 1.1s cubic-bezier(.2,.9,.3,1.2) both}
.beach .crate .box{background:#fff;border-radius:18px;padding:10px 6px;box-shadow:0 6px 0 rgba(0,0,0,.12);display:inline-block;min-width:120px;max-width:94%}
.beach .crate .em{font-size:46px}
.beach .crate .nm{font-family:Fredoka;font-weight:600}
.beach .crate .why{font-size:13px;color:var(--muted);margin-top:2px}
@keyframes wash{0%{transform:translateY(-130px) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:none}}
.beach .wave{position:absolute;left:-10%;width:120%;top:48%;height:30px;background:radial-gradient(circle at 20px -6px,transparent 18px,#fff 19px) 0 0/40px 30px repeat-x;opacity:.8;animation:surf 4s linear infinite}
@keyframes surf{to{transform:translateX(40px)}}
.beach .sunb{position:absolute;right:30px;top:20px;width:60px;height:60px;border-radius:50%;background:var(--sun);box-shadow:0 0 40px var(--sun)}
.q{background:var(--sea-deep);color:#fff;border-radius:16px;padding:16px 18px;font-family:Fredoka;font-size:21px;margin:10px 0;min-height:60px;display:flex;align-items:center;gap:12px}
.q .qi{font-size:28px}
.results h2{margin-top:0}
.bars{display:flex;flex-direction:column;gap:10px;margin:12px 0 20px}
.bar{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;font-weight:700}
.bar .track{background:#e8f0f1;border-radius:99px;height:26px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;transition:width 1s ease}
.archs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.arch{background:#fff;border-radius:16px;padding:14px;border-top:6px solid}
.arch h3{margin:0 0 6px;font-size:20px}
.arch .who{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.stat{background:#fff;border-radius:16px;padding:14px}
.stat .big{font-family:Fredoka;font-size:22px;font-weight:600}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.prompts li{margin:6px 0;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(10,40,48,.6);display:none;place-items:center;z-index:50;padding:20px}
.overlay.show{display:grid}
.overlay .panel{max-width:520px;text-align:center}
.overlay .panel .big{font-size:60px}
.seabg{position:fixed;left:0;right:0;bottom:0;height:90px;z-index:1;pointer-events:none;opacity:.5}
.err{color:var(--survival);font-weight:700;min-height:20px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{background:#e3f4f6;color:var(--sea-deep);padding:8px 14px;border-radius:99px;font-weight:600}
.tabs button.on{background:var(--sea-deep);color:#fff}
.small{font-size:14px}
@media(max-width:640px){
  .modes{grid-template-columns:1fr}
  .picked{grid-template-columns:1fr}
  .custom{grid-template-columns:1fr}
  .beach{height:auto;padding:20px 10px 30px;display:flex;flex-direction:column;gap:10px}
  .beach .crate{position:static;width:100%}
  .beach .wave,.beach .sunb{display:none}
  .panel{padding:18px}
  .stepper{display:none}
  .bar{grid-template-columns:90px 1fr 36px}
}
.homecards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px;text-align:left}
.hc{background:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.hc h3{margin:0;font-size:22px}
.hc .grow{flex:1}
.code{font-family:Fredoka;font-weight:700;font-size:clamp(48px,10vw,84px);letter-spacing:10px;color:var(--sea-deep);line-height:1}
.linkbox{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:6px 6px 6px 14px;max-width:560px;margin:10px auto;border:2px solid #d6e6e8}
.linkbox code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;text-align:left}
.ptag.me{background:#fff0c9}
.ptag .st{font-size:14px}
.pill{display:inline-block;background:#e3f4f6;border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px;color:var(--sea-deep)}
.pill.host{background:var(--sea-deep);color:#fff}
.yourturn{background:var(--sun);color:#3d2600;border-radius:14px;padding:10px 14px;font-family:Fredoka;font-weight:600;font-size:18px;text-align:center;margin-bottom:10px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.hostbar{background:#e3f4f6;border-radius:16px;padding:12px;margin-top:16px}
.hostbar .lbl{font-weight:800;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--sea-deep);margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;max-width:90vw;display:none}
.toast.show{display:block;animation:pop .25s}
.note{background:#fff;border-radius:14px;padding:12px 14px;font-size:14px;border-left:6px solid var(--tools);margin-top:14px;text-align:left}
.locked{background:#e6f6ee;border-radius:16px;padding:16px;text-align:center;font-weight:700}
@media(max-width:820px){.homecards{grid-template-columns:1fr}}
.cbox{background:#fff;border:3px solid var(--sun);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 4px 0 rgba(201,127,0,.25)}
.ctitle{font-size:24px;margin-bottom:10px}
.crow{display:flex;gap:12px;align-items:center}
.cprev{font-size:54px;width:90px;height:90px;display:grid;place-items:center;background:#fff6df;border-radius:20px;flex:none;transition:transform .15s}
.cprev.bump{transform:scale(1.15)}
input.cinput{font-size:21px;padding:18px 18px;border-width:3px}
.clbl{font-weight:800;margin:16px 0 8px}
.esug,.egrid{display:flex;flex-wrap:wrap;gap:8px}
.ebtn{font-size:30px;width:58px;height:58px;border-radius:14px;background:#f2f8f9;border:3px solid transparent;font-family:inherit;line-height:1;padding:0}
.ebtn:hover{background:#fff6df}
.ebtn.on{border-color:var(--sun);background:#fff6df}
.emore summary{cursor:pointer;font-weight:700;color:var(--sea-deep);margin-top:10px}
.egrid{margin-top:10px;max-height:230px;overflow:auto;padding:2px}
.ccats{display:flex;flex-wrap:wrap;gap:8px}
.ccat{padding:10px 16px;border-radius:99px;background:#f2f8f9;font-weight:600;border:3px solid transparent;font-size:16px;color:var(--ink)}
.ccat.on{background:#fff;border-color:var(--ccol)}
.cfoot{display:flex;justify-content:flex-end;margin-top:14px}
.item.other{grid-column:span 2;border:3px dashed var(--sun);background:#fffaf0;display:flex;align-items:center;justify-content:center;gap:12px}
.item.other .em{font-size:40px}.item.other .nm{font-size:17px;font-family:Fredoka;font-weight:600}
.slot textarea{margin-top:6px;font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:2px solid #d6e6e8;width:100%;resize:vertical;min-height:52px}
.slot textarea:focus{outline:none;border-color:var(--sea)}
.facts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left;margin:16px 0}
.fact{background:#fff;border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.fact .fe{font-size:28px;line-height:1}
.fact .fl{font-weight:800;font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
.rules{background:var(--sea-deep);color:#fff;border-radius:14px;padding:14px 18px;text-align:left;margin:10px 0 16px;font-size:15px}
.rules ul{margin:6px 0 0;padding-left:20px}.rules li{margin:3px 0}
.brief{border-radius:20px;overflow:hidden;margin-bottom:12px;padding-top:8px}
.sctag{display:inline-block;background:#fff;border-radius:99px;padding:5px 14px;font-family:Fredoka;font-weight:600;color:var(--sea-deep)}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:10px 0 16px}
.sc{background:#fff;border:3px solid #d6e6e8;border-radius:16px;padding:12px;cursor:pointer;text-align:left;transition:.12s}
.sc:hover{transform:translateY(-2px)}
.sc.on{border-color:var(--sea);background:#eefafb}
.sc .se{font-size:34px}
.twl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:8px}
.tw{background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;border:2px solid #d6e6e8;font-family:Nunito;font-size:14px;color:var(--ink);display:flex;gap:10px;align-items:center}
.tw:hover{border-color:var(--sun);background:#fffaf0}
.tw .te{font-size:24px}
.tw.rnd{border-style:dashed;border-color:var(--sun)}
.sndb{background:rgba(255,255,255,.75);border-radius:99px;width:40px;height:40px;font-size:18px;padding:0}
.sndb.off{opacity:.45}
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 18px;text-align:left}
.howto div{background:#fff;border-radius:14px;padding:12px;font-size:14px}
.howto b{display:block;font-family:Fredoka;font-size:16px;margin-bottom:2px}
@media(max-width:820px){.facts-grid{grid-template-columns:1fr 1fr}.howto{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.facts-grid{grid-template-columns:1fr}.item.other{grid-column:span 1;flex-direction:column;gap:2px}.ebtn{width:50px;height:50px;font-size:26px}}
</style>
</head>
<body>
<svg class="seabg" viewBox="0 0 1200 90" preserveAspectRatio="none"><path fill="#0e7c8f" d="M0 40 Q 75 10 150 40 T 300 40 T 450 40 T 600 40 T 750 40 T 900 40 T 1050 40 T 1200 40 V90 H0Z"><animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 40 Q 75 10 150 40 T 300 40 T 450 40 T 600 40 T 750 40 T 900 40 T 1050 40 T 1200 40 V90 H0Z;M0 40 Q 75 70 150 40 T 300 40 T 450 40 T 600 40 T 750 40 T 900 40 T 1050 40 T 1200 40 V90 H0Z;M0 40 Q 75 10 150 40 T 300 40 T 450 40 T 600 40 T 750 40 T 900 40 T 1050 40 T 1200 40 V90 H0Z"/></path></svg>

<div class="wrap">
  <header class="top">
    <div class="logo" style="cursor:pointer" id="logo">🏝️ Non-P0 <span class="o">island</span></div>
    <div class="row" style="gap:8px"><span class="pill" id="netst" style="display:none"></span><button class="sndb" id="sfxb" title="Sound effects on/off" aria-label="Sound effects">🔊</button><button class="sndb" id="ambb" title="Ocean waves on/off" aria-label="Ocean waves">🌊</button><div class="stepper" id="stepper"></div></div>
  </header>
  <main id="app"></main>
</div>

<div class="overlay" id="overlay"><div class="panel" id="overlayBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const CATS={
  survival:{label:"Survival",color:"var(--survival)",arch:"The Survivor",archEm:"🔥",desc:"Keeps everyone alive. Thinks about risks first."},
  tools:{label:"Tools",color:"var(--tools)",arch:"The Builder",archEm:"🛠️",desc:"A fixer who'd have a hut built by week two."},
  comfort:{label:"Comfort",color:"var(--comfort)",arch:"The Comfort-Seeker",archEm:"🎸",desc:"Turns a crisis into a long holiday."},
  personal:{label:"Personal",color:"var(--personal)",arch:"The Sentimentalist",archEm:"💌",desc:"Brings people and meaning along."}
};
const CAT_EM={survival:"🧰",tools:"⚙️",comfort:"✨",personal:"💛"};
const ITEMS=[
  {n:"Knife",e:"🔪",c:"survival"},{n:"Box of matches",e:"🔥",c:"survival"},{n:"First-aid kit",e:"🩹",c:"survival"},
  {n:"Tarp",e:"⛺",c:"survival"},{n:"Water purifier",e:"💧",c:"survival"},
  {n:"Rope (50 m)",e:"🪢",c:"tools"},{n:"Fishing kit",e:"🎣",c:"tools"},{n:"Axe",e:"🪓",c:"tools"},
  {n:"Solar flashlight",e:"🔦",c:"tools"},{n:"Cooking pot",e:"🍲",c:"tools"},
  {n:"Favorite book",e:"📖",c:"comfort"},{n:"Guitar",e:"🎸",c:"comfort"},{n:"Hammock",e:"🏖️",c:"comfort"},
  {n:"Deck of cards",e:"🃏",c:"comfort"},{n:"Hot sauce (lifetime)",e:"🌶️",c:"comfort"},
  {n:"Photo of loved ones",e:"🖼️",c:"personal"},{n:"Journal & pen",e:"📓",c:"personal"},{n:"A pet dog",e:"🐶",c:"personal"},
  {n:"Seeds to plant",e:"🌱",c:"personal"},{n:"Volleyball",e:"🏐",c:"personal"}
];
const HINTS=["What would you miss most after one month?","Think about day 1 — and then about day 300.","Try one item for your body, one for your mind, one for your heart.","Are you a fixer, a planner, or a beach lounger?","What could you NOT make yourself from coconuts and sticks?","Which item would make the best story when you're rescued?","What keeps you sane when it rains for a week straight?"];
const QUESTIONS=["Why that over a knife?","Which of your three would you drop first?","What would you trade for someone else's item?","How does that help you on day 200?","Would your best friend have guessed these picks?","Which item is secretly the most useful?","What's the first thing you'd do on day one?","Which pick is pure heart, no logic?","If a storm took one item, which hurts the most?","Who here would you most like as an island neighbor, based on their picks?"];
const TWISTS=[
  {e:"🌊",t:"Your water source dries up!",q:"Who's in trouble now? Who adapts best?"},
  {e:"🦜",t:"You're not alone — there's one other castaway on the island.",q:"Whose items would you want to team up with?"},
  {e:"⛈️",t:"A storm hits! Everyone loses ONE of their three items.",q:"Which one does each person give up?"},
  {e:"🔄",t:"Trade market is open! Everyone may swap one item with another player.",q:"Who's making a deal?"},
  {e:"🚁",t:"Rescue comes in half the time.",q:"Would anyone change their picks?"},
  {e:"📦",t:"A crate washes ashore — everyone gets a 4th item!",q:"What do you add, and why?"},
  {e:"🏝️",t:"You all landed on the SAME island.",q:"As a team, which 5 items from everyone's picks do you keep?"},
  {e:"⏳",t:"Rescue is delayed — you're staying twice as long.",q:"Which of your items lasts the distance?"}
];
const NOT_THERE=["🚫","Not there","No other people, no buildings, no phone signal or internet"];
const SCENARIOS=[
  {id:"tropical",name:"Tropical Island",em:"🌴",dur:"1 year",tag:"The classic",sky:["#8fd3e8","#e9f7f4"],sand:"#f6dfa4",sandD:"#e7c47a",leaf:"#2a9d6f",

/* Picker: edits `list` in place; calls onChange() after any change */
function mountPicker(el,list,mode,onChange){
  const fresh=()=>({text:"",emoji:null,cat:null,open:mode==='B'});
  let cs=fresh();
  const draw=()=>{
    const slots=[0,1,2].map(i=>{const it=list[i];
      return it?`<div class="slot full"><div class="em">${esc(it.e)}</div><div class="fd">${esc(it.n)}</div><textarea data-why="${i}" rows="2" placeholder="Why this? (optional)" maxlength="80">${esc(it.why||'')}</textarea><button type="button" class="btn sec sm" style="margin-top:6px;padding:4px 10px;font-size:13px" data-rm="${i}">Remove</button></div>`
               :`<div class="slot"><div class="muted fd" style="font-size:22px">${i+1}</div><div class="muted small">empty</div></div>`}).join("");
    const full=list.length>=3;
    const custom=`<div class="cbox" data-cbox style="${cs.open&&!full?'':'display:none'}">

        <details class="emore"><summary>More emojis…</summary><div class="egrid" id="egrid">${EMOJI_PALETTE.map(e=>`<button type="button" class="ebtn" data-e="${e}">${e}</button>`).join("")}</div></details>

        <div class="ccats" id="ccats"></div>
        <div class="err" id="cerr"></div>
        <div class="cfoot"><button type="button" class="btn" id="cadd">Add to my 3 ➕</button></div>
      </div>`;
    el.innerHTML=`<div class="picked">${slots}</div>
      ${mode==='B'?custom+`<div class="fd" style="font-size:18px;margin-top:14px">…or grab something from the crate</div>`:''}
      <div class="legend">${legend()}</div>
      <div class="grid">${ITEMS.map((it,i)=>itemCard(it,list.some(m=>m.n===it.n),full&&!list.some(m=>m.n===it.n),i)).join("")}
        ${mode==='A'?`<div class="item other ${full?'dim':''}" data-other="1"><div class="em">✍️</div><div class="nm">Something else…<br><span class="muted small" style="font-family:Nunito">type anything + pick an emoji</span></div></div>`:''}</div>
      ${mode==='A'?custom:''}`;
    el.querySelectorAll(".grid .item[data-i]").forEach(c=>c.onclick=()=>{
      const it=ITEMS[+c.dataset.i];const k=list.findIndex(m=>m.n===it.n);
      if(k>=0){list.splice(k,1);play("unpick")}else if(list.length<3){list.push({...it,why:""});play("pick")}else return;
      draw();onChange();
    });
    const ob=el.querySelector("[data-other]");
    if(ob)ob.onclick=()=>{if(list.length>=3)return;cs.open=true;const b=el.querySelector("[data-cbox]");b.style.display="";if(b.scrollIntoView)b.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>el.querySelector("#cn").focus(),300);play("pick")};
    el.querySelectorAll("[data-why]").forEach(inp=>inp.oninput=()=>{list[+inp.dataset.why].why=inp.value;onChange(true)});
    el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{list.splice(+b.dataset.rm,1);play("unpick");draw();onChange()});
    // custom box
    const inp=el.querySelector("#cn");
    if(inp){
      inp.value=cs.text;
      inp.oninput=()=>{cs.text=inp.value;upd()};
      inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};
      el.querySelector("#cadd").onclick=add;
      el.querySelectorAll("#egrid [data-e]").forEach(b=>b.onclick=()=>{cs.emoji=b.dataset.e;play("emoji");upd(true)});
      upd();
    }
  };
  const cur=()=>{const sug=suggestEmojis(cs.text);const cat=cs.cat||guessCat(cs.text);return {sug,cat,em:cs.emoji||sug[0]||CAT_EM[cat]}};
  function upd(bump){
    const {sug,cat,em}=cur();
    const pv=el.querySelector("#cprev");if(!pv)return;pv.textContent=em;
    if(bump){pv.classList.add("bump");setTimeout(()=>pv.classList.remove("bump"),160)}
    let opts=[...new Set([em,...sug,...DEFAULT_SUG])].slice(0,10);
    el.querySelector("#esug").innerHTML=opts.map(e=>`<button type="button" class="ebtn ${e===em?'on':''}" data-e="${e}">${e}</button>`).join("")+(sug.length?`<span class="muted small" style="align-self:center">✨ suggested for “${esc(cs.text.trim().slice(0,24))}”</span>`:"");
    el.querySelectorAll("#esug [data-e]").forEach(b=>b.onclick=()=>{cs.emoji=b.dataset.e;play("emoji");upd(true)});
    el.querySelectorAll("#egrid [data-e]").forEach(b=>b.classList.toggle("on",b.dataset.e===em));
    el.querySelector("#ccats").innerHTML=Object.entries(CATS).map(([k,c])=>`<button type="button" class="ccat ${k===cat?'on':''}" data-c="${k}" style="--ccol:${c.color}"><span style="color:${c.color}">●</span> ${c.label}</button>`).join("");
    el.querySelectorAll("#ccats [data-c]").forEach(b=>b.onclick=()=>{cs.cat=b.dataset.c;upd()});
  }
  function add(){
    const er=el.querySelector("#cerr");const n=cs.text.trim();
    if(!n){er.textContent="Type what you'd bring first.";el.querySelector("#cn").focus();return}
    if(list.length>=3){er.textContent="Already 3 items — remove one first.";return}
    if(list.some(m=>m.n.toLowerCase()===n.toLowerCase())){er.textContent="You already have that one!";return}
    if(/\b(boat|phone|smartphone|iphone|helicopter|plane|yacht|raft|jet ?ski|satellite)\b/i.test(n)){er.textContent="Nice try 😄 No boats, working phones or ways to escape!";return}
    const {cat,em}=cur();
    list.push({n:n.slice(0,40),e:em,c:cat,why:"",custom:true});
    cs=fresh();play("pick");draw();onChange();
  }
  draw();
}

function resultsHTML(entries){
  const all=entries.flatMap(p=>p.picks);
  const counts={survival:0,tools:0,comfort:0,personal:0};all.forEach(i=>{if(counts[i.c]!==undefined)counts[i.c]++});

  const byItem={};entries.forEach(p=>p.picks.forEach(i=>{const k=i.n.toLowerCase();(byItem[k]=byItem[k]||{n:i.n,e:i.e,k:0,who:[]});byItem[k].k++;byItem[k].who.push(p.name)}));
  const ranked=Object.values(byItem).sort((a,b)=>b.k-a.k);
  const top=ranked[0];const uniques=ranked.filter(r=>r.k===1);
  const unpicked=ITEMS.filter(i=>!byItem[i.n.toLowerCase()]);
  const groups={survival:[],tools:[],comfort:[],personal:[],balanced:[]};
  entries.forEach(p=>{const c={};p.picks.forEach(i=>c[i.c]=(c[i.c]||0)+1);
    const best=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
    if(!best||best[1]<2||!groups[best[0]])groups.balanced.push(p.name);else groups[best[0]].push(p.name)});
  const sv=counts.survival+counts.tools, cf=counts.comfort+counts.personal;
  const verdict=sv>cf?"This group leans <b>practical</b> — you'd survive, but would you have fun?":cf>sv?"This group leans <b>comfort & heart</b> — great vibes, questionable survival odds.":"A perfectly <b>balanced</b> island — survival and soul in equal measure.";
  return `<h2 style="font-size:32px;margin-top:0">📊 Island patterns</h2>
    <p style="font-size:18px">${verdict}</p>
    <div class="bars">${Object.entries(CATS).map(([k,c])=>`<div class="bar"><span>${c.label}</span><div class="track"><div class="fill" data-w="${counts[k]/total*100}" style="width:0;background:${c.color}"></div></div><span>${counts[k]}</span></div>`).join("")}</div>
    <div class="stats">
      <div class="stat"><div class="lbl">Most popular</div><div class="big">${top?`${esc(top.e)} ${esc(top.n)}`:'—'}</div><div class="muted small">${top?`picked ${top.k}×`:''}</div></div>
      <div class="stat"><div class="lbl">One-of-a-kind picks</div><div class="big">${uniques.length}</div><div class="muted small">${uniques.slice(0,4).map(u=>`${esc(u.e)} ${esc(u.n)} (${esc(u.who[0])})`).join(" · ")}</div></div>
      <div class="stat"><div class="lbl">Left in the crate</div><div class="big">${unpicked.length?unpicked.slice(0,5).map(i=>i.e).join(" "):'Nothing!'}</div><div class="muted small">${unpicked.length?`Nobody took the ${esc(unpicked[0].n.toLowerCase())}…`:'Every item found a home.'}</div></div>
    </div>
    <h2>Who's who on the island</h2>
    <div class="archs">
      ${Object.entries(CATS).filter(([k])=>groups[k].length).map(([k,c])=>`<div class="arch" style="border-color:${c.color}"><h3>${c.archEm} ${c.arch}</h3><div class="muted small">${c.desc}</div><div class="who" style="margin-top:8px">${groups[k].map(esc).join(", ")}</div></div>`).join("")}
      ${groups.balanced.length?`<div class="arch" style="border-color:var(--sun)"><h3>⚖️ The All-Rounder</h3><div class="muted small">A bit of everything — body, mind and heart.</div><div class="who" style="margin-top:8px">${groups.balanced.map(esc).join(", ")}</div></div>`:''}
    </div>

}

function timerHTML(){const R=96,C=2*Math.PI*R;return `<div class="ring"><svg width="220" height="220"><circle cx="110" cy="110" r="${R}" stroke="#e3f4f6" stroke-width="16" fill="none"/>

/* ---------- ONLINE MODE (peer-to-peer: the host's browser runs the game) ---------- */
const OSTEPS=["Lobby","Scenario","Think","Share","Patterns"];
const PHASES=["lobby","scenario","think","share","results"];
const PREFIX="np0island-v1-";
const O={code:null,role:null,game:null,players:[],draft:[],draftKey:"",viewKey:"",lastTwist:null,nick:"",peer:null,conns:{},conn:null,loaded:false,loadTimer:null,retry:null};
let HS=null; // host-only authoritative state {game, players:{id:{...}}}
const genCode=()=>Array.from({length:4},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[rand(31)]).join("");
const joinLink=c=>location.origin+location.pathname+"#"+c;
const isHost=()=>O.role==="host";
const myDoc=()=>O.players.find(p=>p.id===NET.me);
const joined=()=>!!myDoc();
const inRound=p=>p.round===O.game.round;
const lockedPlayers=()=>O.players.filter(p=>inRound(p)&&p.locked&&Array.isArray(p.picks)&&p.picks.length===3).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
function setNet(txt,kind){const el=$("#netst");if(!el)return;el.textContent=txt||"";el.style.display=txt?"inline-block":"none";el.style.background=kind==="bad"?"#ffe1d6":kind==="ok"?"#e6f6ee":"#fff6df"}
const str=(v,n)=>String(v??"").slice(0,n);
function sanitizePicks(a){if(!Array.isArray(a))return[];return a.slice(0,3).map(x=>({n:str(x&&x.n,40).trim(),e:str(x&&x.e,16),c:CATS[x&&x.c]?x.c:"comfort",why:str(x&&x.why,80)})).filter(x=>x.n)}
function parse(d){try{const m=typeof d==="string"?JSON.parse(d):d;return m&&typeof m==="object"?m:null}catch(e){return null}}

/* host side */
function hostPublish(){
  store.set("np0-host-"+O.code,JSON.stringify(HS));
  O.game=HS.game;O.players=Object.entries(HS.players).map(([id,p])=>({id,...p}));
  const msg=JSON.stringify({t:"state",game:HS.game,players:O.players});
  Object.values(O.conns).forEach(c=>{try{if(c.open)c.send(msg)}catch(e){}});
  checkTwist();renderOnline();
}
function gset(patch){if(!isHost())return;Object.assign(HS.game,patch);hostPublish()}
function applyAction(id,a){
  const g=HS.game;let p=HS.players[id];
  if(a.t==="join"){const nick=str(a.nick,24).trim()||"Castaway";
    if(p){p.nick=nick;p.online=true}else{if(Object.keys(HS.players).length>=30)return;HS.players[id]={nick,joinedAt:Date.now(),round:g.round,picks:[],locked:false,online:true}}}
  else if(a.t==="hello"){if(p)p.online=true;else{sendState(id);return}}
  else if(!p)return;
  else if(a.t==="lock"){const picks=sanitizePicks(a.picks);if(picks.length!==3)return;Object.assign(p,{picks,locked:true,round:g.round})}
  else if(a.t==="unlock"){p.locked=false}
  else if(a.t==="leave"){delete HS.players[id]}
  else return;
  hostPublish();
}
function sendState(id){const c=O.conns[id];try{if(c&&c.open)c.send(JSON.stringify({t:"state",game:HS.game,players:O.players}))}catch(e){}}
function createLobby(nick){
  if(!nick){$("#herr").textContent="Enter your name first.";return}
  store.set("np0-nick",nick);
  HS={game:{host:NET.me,phase:"lobby",mode:"A",think:120,scenario:"tropical",active:"tropical",round:1,order:[],turn:0,q:"",twist:null,thinkEnd:0},
      players:{[NET.me]:{nick,joinedAt:Date.now(),round:1,picks:[],locked:false,online:true}}};
  startHost(genCode(),true);
}
function startHost(code,fresh){
  const hs=HS;leaveOnline(true);HS=hs;
  O.code=code;O.role="host";O.loaded=false;O.viewKey="";O.lastTwist=null;setHash(code);
  app.innerHTML=`<div class="panel center"><h2>Building your island ${esc(code)}… 🛠️</h2><p class="muted" id="loadmsg"></p></div>`;
  setNet("Connecting…");
  const peer=new Peer(PREFIX+code);O.peer=peer;
  peer.on("open",()=>{O.loaded=true;setNet("🟢 Hosting — keep this tab open","ok");hostPublish()});
  peer.on("connection",c=>{
    c.on("data",d=>{const m=parse(d);if(!m)return;
      if(!c._pid){c._pid=str(m.from,40);if(!c._pid)return;const old=O.conns[c._pid];O.conns[c._pid]=c;if(old&&old!==c)try{old.close()}catch(e){}}
      if(m.t==="hello"){applyAction(c._pid,{t:"hello"});sendState(c._pid);return}
      applyAction(c._pid,m);});
    c.on("close",()=>{const id=c._pid;if(id&&O.conns[id]===c){delete O.conns[id];if(HS.players[id]){HS.players[id].online=false;hostPublish()}}});
  });
  peer.on("disconnected",()=>{setNet("Reconnecting…");setTimeout(()=>{try{if(O.peer===peer&&!peer.destroyed)peer.reconnect()}catch(e){}},1500)});
  peer.on("error",e=>{
    if(O.peer!==peer)return;
    if(e.type==="unavailable-id"){
      if(fresh&&!O.loaded){try{peer.destroy()}catch(x){}startHost(genCode(),true);return}
      setNet("Re-opening your lobby…");clearTimeout(O.retry);O.retry=setTimeout(()=>{if(O.peer===peer){try{peer.destroy()}catch(x){}startHost(code,false)}},3000);return}
    if(e.type==="peer-unavailable")return;
    setNet("⚠️ Connection problem — retrying","bad");console.warn(e);
  });
}
/* player side */
function joinAsPlayer(code,nick){
  leaveOnline(true);
  O.code=code;O.role="player";O.nick=nick||"";O.loaded=false;O.viewKey="";O.lastTwist=null;setHash(code);
  app.innerHTML=`<div class="panel center"><h2>Paddling to island ${esc(code)}… 🛶</h2><p class="muted" id="loadmsg"></p></div>`;
  setNet("Connecting…");
  const peer=new Peer();O.peer=peer;
  O.loadTimer=setTimeout(()=>{if(!O.loaded)notFound()},15000);
  peer.on("open",()=>connectHost());
  peer.on("disconnected",()=>{setTimeout(()=>{try{if(O.peer===peer&&!peer.destroyed)peer.reconnect()}catch(e){}},1500)});
  peer.on("error",e=>{
    if(O.peer!==peer)return;
    if(e.type==="peer-unavailable"){if(!O.loaded)notFound();else{setNet("🔴 Lost the host — retrying…","bad");scheduleReconnect()}return}
    setNet("⚠️ Connection problem — retrying","bad");console.warn(e);if(O.loaded)scheduleReconnect();
  });
}
function scheduleReconnect(){clearTimeout(O.retry);O.retry=setTimeout(()=>{if(O.role==="player"&&O.peer&&!O.peer.destroyed)connectHost()},3000)}
function connectHost(){
  const c=O.peer.connect(PREFIX+O.code,{reliable:true});O.conn=c;
  c.on("open",()=>{if(O.conn!==c)return;c.send(JSON.stringify({t:"hello",from:NET.me}));
    if(O.nick)c.send(JSON.stringify({t:"join",nick:O.nick,from:NET.me}));});
  c.on("data",d=>{if(O.conn!==c)return;const m=parse(d);if(!m||m.t!=="state"||!m.game)return;
    clearTimeout(O.loadTimer);
    if(!O.loaded){O.loaded=true;const me=Array.isArray(m.players)&&m.players.find(p=>p.id===NET.me);if(me&&!O.nick)O.nick=me.nick}
    setNet("🟢 Connected","ok");
    O.game=m.game;O.players=Array.isArray(m.players)?m.players:[];checkTwist();renderOnline();});
  c.on("close",()=>{if(O.conn!==c||O.role!=="player")return;setNet("🔴 Lost the host — retrying…","bad");scheduleReconnect()});
  c.on("error",()=>{if(O.conn===c&&O.loaded)scheduleReconnect()});
}
function notFound(){
  if(O.role!=="player"||O.loaded)return;
  clearTick();stepper(null);setNet("");
  app.innerHTML=`<div class="panel center"><h2>Can't find island ${esc(O.code)} 🌫️</h2>
    <p class="muted">Check the code with your host. The host's browser tab needs to stay open for the game to run.<br>Some strict office networks or VPNs block direct connections — if it keeps failing, try phone data or another network.</p>
    <div class="row" style="justify-content:center"><button class="btn sec" id="hb">Back</button><button class="btn" id="rt">Try again</button></div></div>`;
  $("#hb").onclick=()=>{leaveOnline();home()};const c=O.code,n=O.nick;$("#rt").onclick=()=>joinAsPlayer(c,n);
}
function act(a){
  if(isHost()){applyAction(NET.me,a);return}
  if(O.conn&&O.conn.open){try{O.conn.send(JSON.stringify({...a,from:NET.me}));return}catch(e){}}
  toast("Reconnecting to the host — try again in a moment.");
}
function checkTwist(){
  const ts=(O.game&&O.game.twist&&O.game.twist.ts)||0;
  if(O.lastTwist===null){O.lastTwist=ts;return}
  if(ts>O.lastTwist){O.lastTwist=ts;showOverlay(twistHTML(TWISTS[O.game.twist.i]||TWISTS[0]))}
}
function leaveOnline(keepHash){
  clearTick();clearTimeout(O.loadTimer);clearTimeout(O.retry);
  try{if(O.peer)O.peer.destroy()}catch(e){}
  O.peer=null;O.conn=null;O.conns={};O.code=null;O.role=null;O.game=null;O.players=[];HS=null;setNet("");
  if(!keepHash)setHash("");
}
function renderOnline(){
  if(!O.code||!O.game)return;
  const g=O.game,me=myDoc();
  stepper(OSTEPS,PHASES.indexOf(g.phase));
  const key=[g.phase,g.round,g.turn,g.q,(g.order||[]).join(","),isHost(),!!me,me&&inRound(me)&&me.locked,g.mode,g.think,g.scenario,g.active,g.thinkEnd,g.phase==="results"?lockedPlayers().map(p=>p.id+JSON.stringify(p.picks)).join("|"):"",g.phase==="share"?JSON.stringify((O.players.find(p=>p.id===(g.order||[])[g.turn])||{}).picks||[]):""].join("~");
  if(key!==O.viewKey){O.viewKey=key;clearTick();({lobby:oLobby,scenario:oScenario,think:oThink,share:oShare,results:oResults})[g.phase]()}
  refreshLive();
}
function playersHTML(){
  const g=O.game;
  return O.players.slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)).map(p=>{
    const st=g.phase==="think"?(inRound(p)&&p.locked?"✅":"⏳"):"";
    return `<span class="ptag ${p.id===NET.me?'me':''}" style="padding-right:14px;${p.online===false?'opacity:.5':''}" title="${p.online===false?'disconnected':''}">${st?`<span class="st">${st}</span>`:''}${esc(p.nick||"Castaway")}${p.id===g.host?' <span class="pill host" style="padding:1px 8px">host</span>':''}${p.id===NET.me?' <span class="muted small">(you)</span>':''}</span>`}).join("")||`<span class="muted">Nobody here yet.</span>`;
}
function refreshLive(){
  const n0=O.players.length;if(O.lastCount!==undefined&&n0>O.lastCount&&O.game.phase==="lobby")play("join");O.lastCount=n0;
  const el=$("#oplayers");if(el)el.innerHTML=playersHTML();

  const sb=$("#startshare");if(sb)sb.disabled=lockedPlayers().length<1;
  const st=$("#startb");if(st)st.disabled=O.players.length<1;
}
function joinBox(){
  const nick=O.nick||store.get("np0-nick")||"";

    <input type="text" id="ojn" placeholder="Your name" maxlength="24" value="${esc(nick)}"><button class="btn" id="ojb">Join 🏝️</button><div class="err" id="ojerr"></div></div>`;
}
function bindJoinBox(){const b=$("#ojb");if(!b)return;b.onclick=()=>{const n=$("#ojn").value.trim();if(!n){$("#ojerr").textContent="Enter your name.";return}store.set("np0-nick",n);O.nick=n;act({t:"join",nick:n})}}
function hostOnly(html){return isHost()?`<div class="hostbar"><div class="lbl">🎙️ Host controls</div>${html}</div>`:""}

function oLobby(){
  const g=O.game,link=joinLink(O.code);
  app.innerHTML=`<div class="panel center">
    <div class="muted fd" style="font-size:18px">Lobby code</div>
    <div class="code">${esc(O.code)}</div>
    <div class="linkbox"><code>${esc(link)}</code><button class="btn sm" id="cpl">Copy link</button></div>

      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="startb">Everyone's here — start! 🚀</button></div></div>`
      :`<p class="fd" style="font-size:20px;margin-top:18px">⏳ Waiting for the host to start…</p><p class="muted">Island: ${g.scenario==='random'||!g.scenario?'🎲 Mystery island':scOf(g.scenario).em+' '+esc(scOf(g.scenario).name)} · Mode: ${g.mode==='A'?'📋 The crate':'✨ Anything goes'} · Think time: ${g.think/60} min</p>`}

  $("#cpl").onclick=()=>copyText(link,"Link copied — share it with your team!");
  bindJoinBox();bindLeave();
  if(isHost()){bindModes(m=>gset({mode:m}));bindThink(t=>gset({think:t}));bindScenarios(x=>gset({scenario:x}));$("#startb").onclick=()=>gset({phase:"scenario",active:resolveSc(g.scenario||"tropical")})}
}
function oScenario(){
  const g=O.game;
  app.innerHTML=`<div class="panel center">${g.scenario==='random'?'<div class="fd" style="font-size:20px;margin-bottom:6px">🎲 Your random island is…</div>':''}${briefingHTML(scOf(g.active))}
    <div class="facts"><span class="chip">${g.mode==='A'?'📋 Pick from the crate (or invent your own)':'✨ Anything you can carry'}</span><span class="chip">⏱️ ${g.think/60} min to decide</span></div>
    ${joined()?'':joinBox()}
    ${isHost()?hostOnly(`<div class="row" style="justify-content:center"><button class="btn sec sm" id="bk">← Back to lobby</button><button class="btn" id="go">Start the ${O.game.think/60}-min think timer ⏱️</button></div>`):`<p class="fd" style="font-size:20px">Get ready… the host will start the timer.</p>`}
  </div>`;
  bindJoinBox();play("whoosh");
  if(isHost()){$("#bk").onclick=()=>gset({phase:"lobby"});$("#go").onclick=()=>gset({phase:"think",thinkEnd:Date.now()+O.game.think*1000})}
}
function oThink(){
  const g=O.game,me=myDoc();
  const dk=O.code+"/"+g.round;
  if(O.draftKey!==dk){O.draftKey=dk;O.draft=me&&inRound(me)&&Array.isArray(me.picks)?me.picks.map(x=>({...x})):[]}
  const locked=me&&inRound(me)&&me.locked;
  app.innerHTML=`<div class="panel">
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
      <div><h2 style="margin:0">Pick your 3 items 🤫</h2><p class="muted" style="margin:4px 0 0">${scOf(g.active).em} ${esc(scOf(g.active).name)} · ${esc(scOf(g.active).dur)}. Choose on your own device — nobody sees your picks until the share round.</p></div>
      <div style="width:160px;height:160px;transform:scale(.72);transform-origin:top right">${timerHTML()}</div>
    </div>
    <div class="hint" id="hint">💡 ${pick(HINTS)}</div>
    ${!me?joinBox():locked?`<div class="locked">🔒 Locked in! ${O.draft.map(i=>`${esc(i.e)} ${esc(i.n)}`).join(" · ")}<div style="margin-top:10px"><button class="btn sec sm" id="unlock">✏️ Change my picks</button></div></div>`
      :`<div id="picker"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><span class="muted small" id="lockhint"></span><button class="btn" id="lockb">🔒 Lock in my 3</button></div>`}
    <h3 id="ocount" style="margin-bottom:4px"></h3><div class="players" id="oplayers"></div>
    ${hostOnly(`<div class="row" style="justify-content:space-between"><button class="btn sec sm" id="addt">+30 seconds</button><button class="btn" id="startshare">Start the share round 🎤</button></div><div class="muted small" style="margin-top:6px">Only players who locked in will be in the share round.</div>`)}
  </div>`;
  bindJoinBox();
  const total=g.think;
  let lastSec=null;
  const upd=()=>{const left=(g.thinkEnd-Date.now())/1000;drawTimer(left,total);const sec=Math.ceil(left);
    if(lastSec!==null&&sec!==lastSec){if(sec>0&&sec<=10)play("tick");if(sec<=0&&lastSec>0)play("gong")}lastSec=sec;
    if(left<=0&&$("#hint")&&!O.tu){O.tu=1;$("#hint").textContent="⏰ Time's up! Lock in your three."}};
  O.tu=0;upd();let n=0;tick=setInterval(()=>{upd();if(++n%25===0&&!O.tu)$("#hint").textContent="💡 "+pick(HINTS)},1000);
  if(me&&!locked){
    const lb=$("#lockb"),lh=$("#lockhint");
    const st=()=>{lb.disabled=O.draft.length<3;lh.textContent=O.draft.length<3?`${3-O.draft.length} more to go `:""};
    mountPicker($("#picker"),O.draft,g.mode,st);st();
    lb.onclick=()=>{const picks=O.draft.map(({n,e,c,why})=>({n,e,c,why:(why||"").slice(0,80)}));play("lock");act({t:"lock",picks})};
  }
  const ub=$("#unlock");if(ub)ub.onclick=()=>act({t:"unlock"});
  if(isHost()){
    $("#addt").onclick=()=>gset({thinkEnd:Math.max(Date.now(),g.thinkEnd)+30000});
    $("#startshare").onclick=()=>{const order=lockedPlayers().map(p=>p.id);if(!order.length)return;gset({phase:"share",order,turn:0,q:pick(QUESTIONS)})};
  }
}
function oShare(){
  const g=O.game,order=g.order||[];
  const pid=order[g.turn];const p=O.players.find(x=>x.id===pid);
  const last=g.turn>=order.length-1;
  const name=p?p.nick:"A castaway who left";
  const picks=p&&inRound(p)&&Array.isArray(p.picks)?p.picks:[];
  app.innerHTML=`<div class="panel">
    ${pid===NET.me?`<div class="yourturn">🎤 It's your turn! Tell everyone why you picked these.</div>`:''}
    <div class="turnhead"><h2>🏝️ ${esc(name)} brought…</h2><div class="progress">Castaway ${g.turn+1} of ${order.length}</div></div>
    ${picks.length?beachHTML(picks,scOf(g.active)):`<p class="muted">Their crate floated away (they left the game).</p>`}
    <div class="q"><span class="qi">❓</span><span>${esc(g.q)}</span></div>
    ${hostOnly(`<div class="row" style="justify-content:space-between"><div class="row"><button class="btn sec sm" id="pv" ${g.turn===0?'disabled':''}>← Previous</button><button class="btn sec sm" id="qb">Another question</button></div><button class="btn" id="nb">${last?'See the patterns 📊':'Next castaway →'}</button></div>`)}
    ${isHost()?'':`<p class="muted center">The host moves to the next castaway.</p>`}
  </div>`;
  if(pid===NET.me)play("turn");if(picks.length)[0,350,700].forEach(d=>play("splash",d+150));
  if(isHost()){
    $("#qb").onclick=()=>{let nq;do{nq=pick(QUESTIONS)}while(nq===g.q);gset({q:nq})};
    $("#pv").onclick=()=>gset({turn:Math.max(0,g.turn-1),q:pick(QUESTIONS)});
    $("#nb").onclick=()=>gset(last?{phase:"results"}:{turn:g.turn+1,q:pick(QUESTIONS)});
  }
}
function oResults(){
  const g=O.game,order=g.order||[];
  const entries=order.map(id=>O.players.find(p=>p.id===id)).filter(p=>p&&inRound(p)&&Array.isArray(p.picks)).map(p=>({name:p.nick||"Castaway",picks:p.picks}));
  app.innerHTML=`<div class="panel results">${resultsHTML(entries)}
    <div class="row" style="justify-content:space-between;margin-top:20px">
      <button class="btn sec" id="cp">📋 Copy summary</button>
      ${isHost()?`<button class="btn" id="again">New round 🔁</button>`:`<span class="muted">The host can throw a twist or start a new round.</span>`}
    </div>
    ${isHost()?`<div class="hostbar">${twistPickerHTML().replace('Pick one to spring on the group','Everyone sees it on their screen. Pick one')}</div>`:''}</div>`;
  animateBars();play("fanfare",200);
  $("#cp").onclick=()=>copyText(summaryText(entries),"Copied! Paste it into your chat or notes.");
  if(isHost()){
    bindTwists(i=>gset({twist:{i,ts:Date.now()}}));
    $("#again").onclick=()=>gset({phase:"lobby",round:g.round+1,order:[],turn:0,twist:null,thinkEnd:0});
  }
}

/* ---------- boot ---------- */
home(true);
(()=>{
  if(typeof Peer==="undefined"){NET.status="off";if(app.querySelector(".homecards"))home(true);return}
  NET.status="ready";
  const code=INIT_HASH,nick=store.get("np0-nick");
  if(/^[A-Z0-9]{4,6}$/.test(code)){
    const saved=parse(store.get("np0-host-"+code));
    if(saved&&saved.game&&saved.game.host===NET.me){HS=saved;Object.values(HS.players).forEach(p=>{if(p!==HS.players[NET.me])p.online=false});startHost(code,false);return}
    joinAsPlayer(code,nick||"");return;
  }
  home(true);
})();
</script>
</body>
