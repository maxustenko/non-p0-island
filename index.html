<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Non-P0 island: a Desert Island ice breaker you can play together from any device.">
<title>Non-P0 island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#0e7c8f; --sea-deep:#0a5566; --sand:#f6dfa4; --sand-d:#e7c47a; --sun:#ffb938;
  --ink:#16323a; --card:var(--card2); --muted:#5d7479;
  --survival:#e4572e; --tools:#3a86c8; --comfort:#9b5de5; --personal:#2a9d6f;
  --radius:18px;
  --tile:#fff;--tile2:#e3f4f6;--line:#d6e6e8;--line2:#c7dfe2;--soft:#f2f8f9;--hl:#fff6df;--card2:#fffaf0;--sel:#eefafb;--track:#e8f0f1;--okbg:#e6f6ee;
  --btnink:#3d2600;--sunsh:#c97f00;--secsh:#9cc9d1;--prad:24px;--wrapw:1040px;
  --bg:linear-gradient(180deg,#8fd3e8 0%,#bfe8f0 45%,#e9f7f4 100%);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);
  background:var(--bg);background-attachment:fixed;transition:color .6s;
  min-height:100vh;overflow-x:hidden;
}
h1,h2,h3,.fd,.logo,.stat .big,.sctag{font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif}
button{font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;cursor:pointer;border:none}
.wrap{max-width:var(--wrapw);transition:max-width .5s;margin:0 auto;padding:20px 18px 60px;position:relative;z-index:2}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;margin-bottom:10px;flex-wrap:wrap}
header.top>.row{justify-content:flex-end;flex:1 1 auto}
.logo{white-space:nowrap;flex:none;font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;font-size:26px;letter-spacing:.5px;color:var(--sea-deep);display:flex;align-items:center;gap:8px}
.logo span.o{color:var(--sun);text-shadow:0 2px 0 var(--sunsh)}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper div{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.55);color:var(--muted)}
.stepper div.on{background:var(--sea-deep);color:#fff}
.panel{background:var(--card);border-radius:var(--prad);padding:26px;box-shadow:0 10px 30px rgba(10,85,102,.18),0 2px 0 rgba(0,0,0,.04);animation:pop .35s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.btn{background:var(--sun);color:var(--btnink);font-weight:600;font-size:18px;padding:13px 26px;border-radius:99px;box-shadow:0 4px 0 var(--sunsh);transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sunsh)}
.btn.sec{background:var(--tile);color:var(--sea-deep);box-shadow:0 4px 0 var(--secsh)}
.btn.sm{font-size:15px;padding:9px 16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.muted{color:var(--muted)}
.hero h1{font-size:clamp(40px,8vw,76px);margin:6px 0 4px;color:var(--sea-deep);line-height:1}
.hero h1 .o{color:var(--sun);text-shadow:0 3px 0 var(--sunsh)}
.hero p.lead{font-size:20px;max-width:620px;margin:10px auto 22px}
.island{width:100%;max-width:720px;display:block;margin:0 auto}
.facts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 22px}
.chip{background:var(--tile);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
input[type=text],textarea,select{font:inherit;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--tile);color:var(--ink);width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--sea)}
.players{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.ptag{background:var(--tile2);border-radius:99px;padding:6px 8px 6px 14px;font-weight:700;display:flex;align-items:center;gap:6px}
.ptag button{background:var(--tile);border-radius:50%;width:24px;height:24px;font-size:14px;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.mode{border:3px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;background:var(--tile);transition:.15s}
.mode.on{border-color:var(--sea);background:var(--sel)}
.mode h3{margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:var(--tile);border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;border:3px solid transparent;position:relative;transition:.12s;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.item:hover{transform:translateY(-3px)}
.item .em{font-size:38px;line-height:1.1}
.item .nm{font-weight:700;font-size:14px;margin-top:4px}
.item .cat{position:absolute;top:8px;left:8px;width:10px;height:10px;border-radius:50%}
.item.on{border-color:var(--sun);background:var(--hl)}
.item.on::after{content:"✓";position:absolute;top:4px;right:8px;font-weight:800;color:var(--sunsh)}
.item.dim{opacity:.4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;margin:8px 0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.timer{font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:clamp(60px,14vw,120px);font-weight:700;color:var(--sea-deep);line-height:1}
.ring{width:220px;height:220px;margin:0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .timer{position:absolute;inset:0;display:grid;place-items:center;font-size:56px}
.hint{background:var(--tile);border-left:6px solid var(--sun);padding:12px 16px;border-radius:12px;font-weight:600;margin:14px auto;max-width:560px;min-height:52px}
.turnhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.turnhead h2{margin:0;font-size:30px}
.progress{font-weight:700;color:var(--muted)}
.picked{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.slot{border:3px dashed var(--line2);border-radius:16px;min-height:120px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--tile)}
.slot.full{border-style:solid;border-color:var(--sun)}
.slot .em{font-size:40px}
.slot input{margin-top:6px;font-size:14px;padding:7px 10px}
.custom{display:grid;grid-template-columns:1fr 160px auto;gap:8px;margin-top:10px}
.beach{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#7fd0e6 0%,#bfeaf2 55%,var(--sand) 55%,var(--sand-d) 100%);height:300px;margin:14px 0}
.beach .crate{position:absolute;bottom:26px;width:30%;text-align:center;animation:wash 1.1s cubic-bezier(.2,.9,.3,1.2) both}
.beach .crate .box{background:var(--tile);border-radius:18px;padding:10px 6px;box-shadow:0 6px 0 rgba(0,0,0,.12);display:inline-block;min-width:120px;max-width:94%}
.beach .crate .em{font-size:46px}
.beach .crate .nm{font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600}
.beach .crate .why{font-size:13px;color:var(--muted);margin-top:2px}
@keyframes wash{0%{transform:translateY(-130px) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:none}}
.beach .wave{position:absolute;left:-10%;width:120%;top:48%;height:30px;background:radial-gradient(circle at 20px -6px,transparent 18px,#fff 19px) 0 0/40px 30px repeat-x;opacity:.8;animation:surf 4s linear infinite}
@keyframes surf{to{transform:translateX(40px)}}
.beach .sunb{position:absolute;right:30px;top:20px;width:60px;height:60px;border-radius:50%;background:var(--sun);box-shadow:0 0 40px var(--sun)}
.q{background:var(--sea-deep);color:#fff;border-radius:16px;padding:16px 18px;font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:21px;margin:10px 0;min-height:60px;display:flex;align-items:center;gap:12px}
.q .qi{font-size:28px}
.results h2{margin:28px 0 12px}.results h2:first-child{margin-top:0}
.bars{display:flex;flex-direction:column;gap:10px;margin:12px 0 20px}
.bar{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;font-weight:700}
.bar .track{background:var(--track);border-radius:99px;height:26px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;transition:width 1s ease}
.archs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.arch{background:var(--tile);border-radius:16px;padding:14px;border-top:6px solid}
.arch h3{margin:0 0 6px;font-size:20px}
.arch .who{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--tile);border-radius:16px;padding:14px}
.stat .big{font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:22px;font-weight:600}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.prompts li{margin:6px 0;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(10,40,48,.6);display:none;place-items:center;z-index:50;padding:20px}
.overlay.show{display:grid}
.overlay .panel{max-width:520px;text-align:center}
.overlay .panel .big{font-size:60px}
.seabg{position:fixed;left:0;right:0;bottom:0;height:90px;z-index:1;pointer-events:none;opacity:.5}
.err{color:var(--survival);font-weight:700;min-height:20px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{background:var(--tile2);color:var(--sea-deep);padding:8px 14px;border-radius:99px;font-weight:600}
.tabs button.on{background:var(--sea-deep);color:#fff}
.small{font-size:14px}
@media(max-width:640px){
  .modes{grid-template-columns:1fr}
  .picked{grid-template-columns:1fr}
  .custom{grid-template-columns:1fr}
  .beach{height:auto;padding:20px 10px 30px;display:flex;flex-direction:column;gap:10px}
  .beach .crate{position:static;width:100%}
  .beach .wave,.beach .sunb{display:none}
  .panel{padding:18px}
  .stepper{display:none}
  .bar{grid-template-columns:90px 1fr 36px}
}
#jc::placeholder{letter-spacing:0;text-transform:none;font-weight:600}
.homecards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px;text-align:left}
.hc{background:var(--tile);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.hc h3{margin:0;font-size:22px}
.hc .grow{flex:1}
.code{font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;font-size:clamp(48px,10vw,84px);letter-spacing:10px;color:var(--sea-deep);line-height:1}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--tile);border-radius:14px;padding:6px 6px 6px 14px;max-width:560px;margin:10px auto;border:2px solid var(--line)}
.linkbox code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;text-align:left}
.ptag.me{background:var(--hl)}
.ptag .st{font-size:14px}
.pill{display:inline-block;background:var(--tile2);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px;color:var(--sea-deep)}
.pill.host{background:var(--sea-deep);color:#fff}
.yourturn{background:var(--sun);color:var(--btnink);border-radius:14px;padding:10px 14px;font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;font-size:18px;text-align:center;margin-bottom:10px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.hostbar{background:var(--tile2);border-radius:16px;padding:12px;margin-top:16px}
.hostbar .lbl{font-weight:800;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--sea-deep);margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;max-width:90vw;display:none}
.toast.show{display:block;animation:pop .25s}
.note{background:var(--tile);border-radius:14px;padding:12px 14px;font-size:14px;border-left:6px solid var(--tools);margin-top:14px;text-align:left}
.locked{background:var(--okbg);border-radius:16px;padding:16px;text-align:center;font-weight:700}
@media(max-width:820px){.homecards{grid-template-columns:1fr}}
.cbox{background:var(--tile);border:3px solid var(--sun);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 4px 0 rgba(201,127,0,.25)}
.ctitle{font-size:24px;margin-bottom:10px}
.crow{display:flex;gap:12px;align-items:center}
.crow input{flex:1;min-width:0}
.cprev{font-size:54px;width:90px;height:90px;display:grid;place-items:center;background:var(--hl);border-radius:20px;flex:none;transition:transform .15s}
.cprev.bump{transform:scale(1.15)}
input.cinput{font-size:21px;padding:18px 18px;border-width:3px}
.clbl{font-weight:800;margin:16px 0 8px}
.esug,.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.ebtn{font-size:30px;width:100%;height:auto;aspect-ratio:1;max-width:64px;border-radius:14px;background:var(--soft);border:3px solid transparent;font-family:inherit;line-height:1;padding:0}
.ebtn:hover{background:var(--hl)}
.ebtn.on{border-color:var(--sun);background:var(--hl)}
.emore summary{cursor:pointer;font-weight:700;color:var(--sea-deep);margin-top:10px}
.egrid{margin-top:4px;padding:2px}
#egrid{max-height:320px;overflow:auto;margin-top:8px;padding-right:4px}
.egh{font-weight:800;font-size:13px;margin:10px 0 2px}
.ccats{display:flex;flex-wrap:wrap;gap:8px}
.ccat{padding:10px 16px;border-radius:99px;background:var(--soft);font-weight:600;border:3px solid transparent;font-size:16px;color:var(--ink)}
.ccat.on{background:var(--tile);border-color:var(--ccol)}
.cfoot{display:flex;justify-content:flex-end;margin-top:14px}
.item.other{grid-column:span 2;border:3px dashed var(--sun);background:var(--card2);display:flex;align-items:center;justify-content:center;gap:12px}
.item.other .em{font-size:40px}.item.other .nm{font-size:17px;font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600}
.slot textarea{margin-top:6px;font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);width:100%;resize:vertical;min-height:52px}
.slot textarea:focus{outline:none;border-color:var(--sea)}
.facts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left;margin:16px 0}
.fact{background:var(--tile);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.fact .fe{font-size:28px;line-height:1}
.fact .fl{font-weight:800;font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
.rules{background:var(--sea-deep);color:#fff;border-radius:14px;padding:14px 18px;text-align:left;margin:10px 0 16px;font-size:15px}
.rules ul{margin:6px 0 0;padding-left:20px}.rules li{margin:3px 0}
.brief{border-radius:20px;overflow:hidden;margin-bottom:12px;padding-top:8px}
.sctag{display:inline-block;background:var(--tile);border-radius:99px;padding:5px 14px;font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;color:var(--sea-deep)}
.scgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 16px}
.sc{background:var(--tile);border:3px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left;transition:.12s}
.sc:hover{transform:translateY(-2px)}
.sc.on{border-color:var(--sea);background:var(--sel)}
.sc .se{font-size:34px}
.twl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:8px}
.tw{background:var(--tile);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;border:2px solid var(--line);font-family:Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;color:var(--ink);display:flex;gap:10px;align-items:center}
.tw:hover{border-color:var(--sun);background:var(--card2)}
.tw .te{font-size:24px}
.tw.rnd{border-style:dashed;border-color:var(--sun)}
.sndb{background:rgba(255,255,255,.75);border-radius:99px;width:40px;height:40px;font-size:18px;padding:0}
.sndb.off{opacity:.45}
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 18px;text-align:left}
.howto div{background:var(--tile);border-radius:14px;padding:12px;font-size:14px}
.howto b{display:block;font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;margin-bottom:2px}
@media(max-width:820px){.facts-grid{grid-template-columns:1fr 1fr}.howto{grid-template-columns:1fr 1fr}}
@media(max-width:520px){header.top>.row{justify-content:flex-start}.scgrid{grid-template-columns:1fr 1fr}.sc{padding:10px}.sc .se{font-size:28px}.cprev{width:62px;height:62px;font-size:36px;border-radius:14px}input.cinput{font-size:17px;padding:14px}
  .linkbox{flex-direction:column;align-items:stretch;padding:10px}.linkbox code{white-space:normal;word-break:break-all;text-align:center}
  .code{letter-spacing:6px}.facts-grid{grid-template-columns:1fr}.item.other{grid-column:span 1;flex-direction:column;gap:2px}.ebtn{width:50px;height:50px;font-size:26px}}

/* ===== island themes ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#fx i{position:absolute;top:0;left:0;font-style:normal;will-change:transform}
@keyframes fxFall{from{transform:translate(0,-12vh) rotate(0)}to{transform:translate(var(--sx,30px),112vh) rotate(var(--rot,360deg))}}
@keyframes fxRise{from{transform:translate(0,105vh) scale(1);opacity:0}10%{opacity:1}to{transform:translate(var(--sx,20px),-10vh) scale(.3);opacity:0}}
@keyframes fxDrift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
@keyframes fxBob{50%{transform:translateY(-8px)}}
#fx .snow{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9;animation:fxFall linear infinite;box-shadow:0 0 6px #fff}
#fx .leaf{font-size:24px;animation:fxFall linear infinite;opacity:.85}
#fx .ember{width:5px;height:5px;border-radius:50%;background:#ffb03a;box-shadow:0 0 10px 3px #ff5a1f;animation:fxRise linear infinite}
#fx .cloud{width:180px;height:50px;border-radius:50px;background:#fff;opacity:.55;filter:blur(2px);animation:fxDrift linear infinite}
#fx .cloud::after{content:"";position:absolute;width:90px;height:70px;border-radius:50%;background:#fff;left:40px;top:-30px}
#fx .gull{font-size:22px;opacity:.55;animation:fxDrift linear infinite}
#fx .glare{position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#fff6b0 0%,#ffd23f55 35%,transparent 70%);animation:fxBob 4s ease-in-out infinite}
.wrap,.toast,.overlay{position:relative}
.toast{position:fixed}.overlay{position:fixed}

body.th-arctic{--sea:#3b7ea8;--sea-deep:#1d4e6e;--sun:#8fd0f5;--sunsh:#3b8fc4;--btnink:#0d2f45;--card:rgba(255,255,255,.74);--card2:#f3f9fd;--tile2:#e4f1fa;--line:#cfe2ee;--line2:#bcd6e8;--soft:#eef6fb;--hl:#e3f3fd;--sel:#e8f4fc;--ink:#173248;--muted:#5b7487;--secsh:#b7d3e6;
  --bg:linear-gradient(180deg,#a9cde8 0%,#d6e8f5 50%,#f7fbfe 100%);--prad:12px}
body.th-arctic .panel{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:2px solid rgba(255,255,255,.95);box-shadow:0 12px 40px rgba(29,78,110,.2)}
body.th-arctic header.top{flex-direction:column;align-items:center;gap:8px}
body.th-arctic .btn{border-radius:10px}
body.th-arctic .stepper div{border-radius:6px}
body.th-arctic .logo span.o{color:#5bb4ea;text-shadow:0 2px 0 #1d4e6e}

body.th-jungle{--sea:#1f7a3f;--sea-deep:#124d28;--sun:#f28c28;--sunsh:#b85e0d;--btnink:#2b1500;--card:#f6faef;--card2:#eef5e3;--tile2:#e2efd6;--line:#cfe0c0;--line2:#bdd4a8;--soft:#edf5e4;--hl:#fff0de;--sel:#e6f3dc;--okbg:#e2f3d6;--ink:#1d2e1a;--muted:#56704f;--secsh:#a7c690;

/* ===== sticky timer bar ===== */
.tbar{position:fixed;top:0;left:0;right:0;z-index:65;background:var(--tbar,var(--sea-deep));color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.22);display:none;overflow:hidden}

#blink{position:fixed;inset:0;pointer-events:none;z-index:64}

@keyframes blinkA{0%{box-shadow:inset 0 0 0 16px rgba(228,64,26,.95);background:rgba(228,64,26,.22)}100%{box-shadow:inset 0 0 0 0 rgba(228,64,26,0);background:rgba(228,64,26,0)}}

.intro{position:fixed;inset:0;z-index:80;display:none;place-items:center;overflow:hidden;cursor:pointer}

.intro .ttl{font-family:Fredoka,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;font-size:clamp(34px,7vw,66px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25);text-align:center;animation:iPop .7s ease 1.5s both;margin-top:-10px}

@keyframes iDrop{0%{transform:translateY(-80vh)}70%{transform:translateY(12px)}85%{transform:translateY(-6px)}100%{transform:none}}

@keyframes iPlane{0%{transform:translate(-60vw,-25vh) rotate(8deg)}55%{transform:translate(0,-18vh) rotate(20deg)}100%{transform:translate(8vw,20vh) rotate(70deg) scale(.4);opacity:0}}

.intro.i-tropical{background:linear-gradient(180deg,#5cc3e4,#bfe8f0 55%,#0e7c8f 100%)}

function noise(d,v,freq,when,q){const c=SND.ctx,n=Math.floor(c.sampleRate*d);const b=c.createBuffer(1,n,c.sampleRate);const a=b.getChannelData(0);

function islandSVG(sc){
  sc=sc||SCENARIOS[0];
  let s=ISLAND.split("#f6dfa4").join(sc.sand).split("#e7c47a").join(sc.sandD).split("#2a9d6f").join(sc.leaf);
  const deco={
    tropical:`<text x="262" y="236" font-size="26">🦀</text><text x="196" y="230" font-size="22">🐚</text>`,
    arctic:`<text x="250" y="236" font-size="28">🦭</text><text x="196" y="232" font-size="22">🐾</text>`,
    jungle:`<text x="250" y="236" font-size="28">🐒</text><text x="420" y="96" font-size="24">🦜</text><text x="196" y="232" font-size="22">🌺</text>`,
    volcano:`<text x="252" y="236" font-size="26">🦎</text><text x="196" y="232" font-size="22">🥚</text>`,
    sandbar:`<text x="560" y="270" font-size="26">🦈</text><text x="150" y="275" font-size="20">🐟</text>`
  }[sc.id]||"";
  s=s.replace(/<text x="262"[\s\S]*?🐚<\/text>/,deco);
  if(sc.id==="volcano")s=s.replace('<ellipse cx="360" cy="236"',`<path d="M430 236 L520 96 L560 96 L660 236Z" fill="#4a4441"/><path d="M520 96 L560 96 L548 112 L532 112Z" fill="#e4572e"/><path d="M530 110 q-8 40 6 70" stroke="#e4572e" stroke-width="5" fill="none" opacity=".8"/>
    <g fill="#9a9a9a" opacity=".55"><circle cx="540" cy="80" r="14"><animate attributeName="cy" values="84;30" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="4s" repeatCount="indefinite"/></circle><circle cx="552" cy="70" r="10"><animate attributeName="cy" values="80;20" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="3.2s" repeatCount="indefinite"/></circle></g><ellipse cx="360" cy="236"`);
  if(sc.id==="arctic"){s=s.replace('<ellipse cx="360" cy="262" rx="330" ry="34" fill="#0e7c8f"/>','<ellipse cx="360" cy="262" rx="330" ry="34" fill="#5c9fb8"/>');
    let flakes="";for(let i=0;i<22;i++){const x=20+i*32,d=(3+(i%5)).toFixed(1);flakes+=`<circle cx="${x}" cy="-10" r="${2+(i%3)}" fill="#fff"><animate attributeName="cy" values="-10;300" dur="${d}s" begin="${(i%7)*.5}s" repeatCount="indefinite"/></circle>`}
    s=s.replace("</svg>",flakes+"</svg>")}
  if(sc.id==="jungle"){s=s.replace('<path d="M352 232',`<g fill="#2f8f4f"><ellipse cx="250" cy="214" rx="60" ry="30"/><ellipse cx="470" cy="214" rx="70" ry="34"/><ellipse cx="310" cy="206" rx="40" ry="26" fill="#1f7a3f"/></g><path d="M352 232`)}
  if(sc.id==="sandbar"){s=s.replace('<ellipse cx="360" cy="236" rx="190" ry="40"','<ellipse cx="360" cy="240" rx="110" ry="28"').replace('<ellipse cx="360" cy="230" rx="175" ry="32"','<ellipse cx="360" cy="236" rx="98" ry="22"').replace(/<g><rect x="452"[\s\S]*?<\/g>/,"")}
  return s.replace('aria-label="A small desert island with a palm tree"',`aria-label="${sc.name}"`);
}

/* ---------- sticky timer, blink, announcements ---------- */
const TB={prev:null,annT:null};
const fmtT=x=>`${Math.floor(x/60)}:${String(x%60).padStart(2,"0")}`;
function showTimerBar(sub){const b=document.getElementById("tbar");b.className="tbar show";document.getElementById("tbsub").textContent=sub||"";document.getElementById("tblbl").textContent="⏱️ Pick your 3 items";document.body.classList.add("timer-on");TB.prev=null}
function hideTimerBar(){const b=document.getElementById("tbar");if(b)b.className="tbar";document.body.classList.remove("timer-on");TB.prev=null}
function timerPaused(on){const l=document.getElementById("tblbl");if(l)l.textContent=on?"⏸️ Paused":"⏱️ Pick your 3 items"}
function blinkScreen(big){const b=document.getElementById("blink");b.className="";void b.offsetWidth;b.className=big?"big":"on"}
function say(t){if(!SND.fx)return;try{if(!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(t);u.rate=1.05;u.pitch=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function announce(text,speech,red){const a=document.getElementById("announce");a.textContent=text;a.className="announce";void a.offsetWidth;a.className="announce show"+(red?" red":"");
  clearTimeout(TB.annT);TB.annT=setTimeout(()=>{a.className="announce"},2900);play("announce");if(speech)setTimeout(()=>say(speech),450)}
function timerTick(left,total){
  left=Math.max(0,Math.ceil(left));
  const bar=document.getElementById("tbar");if(!bar||!bar.classList.contains("show"))return;
  document.getElementById("tbnum").textContent=left>0?fmtT(left):"Time's up!";
  document.getElementById("tbfill").style.width=(total>0?Math.min(100,left/total*100):0)+"%";
  bar.classList.toggle("warn",left>0&&left<=10);bar.classList.toggle("done",left===0);
  const p=TB.prev;
  if(p!==null&&left!==p){
    if(p>60&&left<=60&&left>0)announce("⏰ 1 minute left!","One minute left");
    if(p>30&&left<=30&&left>0)announce("⏳ 30 seconds left!","Thirty seconds left");
    if(left>0&&left<=10){blinkScreen();play("tick");if(left===10)say("Ten seconds")}
    if(left===0&&p>0){blinkScreen(true);play("gong");announce("⏰ Time's up! Lock in your three.","Time's up",true)}
  }
  TB.prev=left;
}

/* ---------- island themes + intro ---------- */
const REDUCED=(()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();
let curTheme=null;
function applyTheme(id){
  if(curTheme===id)return;curTheme=id;
  [...document.body.classList].filter(c=>c.startsWith("th-")).forEach(c=>document.body.classList.remove(c));if(id)document.body.classList.add("th-"+id);
  const fx=document.getElementById("fx");if(!fx)return;fx.innerHTML="";
  if(REDUCED||!id)return;
  const r=(a,b)=>a+Math.random()*(b-a);let h="";
  if(id==="arctic")for(let i=0;i<45;i++)h+=`<i class="snow" style="left:${r(0,100)}vw;--sx:${r(-60,60)}px;animation-duration:${r(7,16)}s;animation-delay:-${r(0,16)}s;transform:scale(${r(.4,1.2)})"></i>`;
  if(id==="jungle")for(let i=0;i<14;i++)h+=`<i class="leaf" style="left:${r(0,100)}vw;--sx:${r(-120,120)}px;--rot:${r(200,720)}deg;animation-duration:${r(10,20)}s;animation-delay:-${r(0,20)}s;font-size:${r(16,30)}px">${pick(["🍃","🌿","🍂","🦋"])}</i>`;
  if(id==="volcano")for(let i=0;i<36;i++)h+=`<i class="ember" style="left:${r(0,100)}vw;--sx:${r(-80,80)}px;animation-duration:${r(5,11)}s;animation-delay:-${r(0,11)}s"></i>`;
  if(id==="tropical")for(let i=0;i<4;i++)h+=`<i class="cloud" style="top:${r(4,40)}vh;animation-duration:${r(60,110)}s;animation-delay:-${r(0,100)}s;transform:scale(${r(.6,1.2)})"></i>`;
  if(id==="sandbar"){h+=`<div class="glare"></div>`;for(let i=0;i<3;i++)h+=`<i class="gull" style="top:${r(6,30)}vh;animation-duration:${r(25,45)}s;animation-delay:-${r(0,40)}s">🕊️</i>`}
  fx.innerHTML=h;
}
const INTRO_SFX={
  tropical:()=>{play("planeDive");play("splash",1150);play("splash",1350)},
  arctic:()=>{play("crack");play("crack",250);play("thud",1300)},
  jungle:()=>{play("rustle");play("birds",900)},

let introT=null;
function playIntro(sc){
  if(REDUCED)return;
  const el=document.getElementById("intro");
  let extra="";
  if(sc.id==="tropical")extra=`<div class="plane">✈️</div><div class="ring"></div>`;
  if(sc.id==="arctic")extra=`<div class="flash"></div><svg class="crack" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="50,0 46,20 54,35 44,55 52,75 47,100"/><polyline points="46,20 30,28 14,25"/><polyline points="54,35 72,40 88,54"/><polyline points="44,55 24,63 8,60"/><polyline points="52,75 70,82"/></svg>`;
  if(sc.id==="jungle"){const lv="🌿🍃🌴🌿🍃🌱".repeat(10);extra=`<div class="leaves l">${lv}</div><div class="leaves r">${lv}</div>`}
  if(sc.id==="volcano"){extra=`<div class="flash red"></div>`;for(let i=0;i<28;i++){const a=Math.random()*Math.PI,d=180+Math.random()*320;extra+=`<i class="lava" style="--dx:${Math.cos(a)*d*(Math.random()<.5?-1:1)}px;--dy:${-Math.sin(a)*d-60}px;animation-delay:${.4+Math.random()*.9}s"></i>`}}
  if(sc.id==="sandbar")extra=`<div class="gull">🕊️</div>`;
  el.className="intro i-"+sc.id;
  el.innerHTML=`<div class="istage">${extra}<div class="isl">${islandSVG(sc)}</div><div class="ttl">${sc.em} ${esc(sc.name)}</div><div class="sub">Stranded for ${esc(sc.dur)}</div></div><div class="skip">tap to skip</div>`;
  void el.offsetWidth;el.classList.add("show");
  try{(INTRO_SFX[sc.id]||(()=>{}))()}catch(e){}
  clearTimeout(introT);introT=setTimeout(()=>{el.className="intro";el.innerHTML=""},4400);
  el.onclick=()=>{clearTimeout(introT);el.className="intro";el.innerHTML=""};
}

const SCENARIO_TEXT=`<h2 style="font-size:32px;margin:8px 0">You're stranded on a desert island for one year.</h2>
<p class="lead" style="font-size:19px;max-width:640px;margin:0 auto 10px">Your plane went down. There's a freshwater spring and coconut trees — but no people, no buildings, no signal. Before the wreck sinks, you can grab <b>three items</b>. Only three.</p>`;

function legend(){return Object.values(CATS).map(c=>`<span><i style="background:${c.color}"></i>${c.label}</span>`).join("")}
function itemCard(it,on,dim,idx){
  return `<div class="item ${on?'on':''} ${dim?'dim':''}" ${idx!==undefined?`data-i="${idx}"`:''}><span class="cat" style="background:${CATS[it.c].color}"></span><div class="em">${it.e}</div><div class="nm">${esc(it.n)}</div></div>`;

/* Picker: edits `list` in place; calls onChange() after any change */
function mountPicker(el,list,mode,onChange){
  const fresh=()=>({text:"",emoji:null,cat:null,open:mode==='B'});
  let cs=fresh();
  const draw=()=>{
    const slots=[0,1,2].map(i=>{const it=list[i];
      return it?`<div class="slot full"><div class="em">${esc(it.e)}</div><div class="fd">${esc(it.n)}</div><textarea data-why="${i}" rows="2" placeholder="Why this? (optional)" maxlength="80">${esc(it.why||'')}</textarea><button type="button" class="btn sec sm" style="margin-top:6px;padding:4px 10px;font-size:13px" data-rm="${i}">Remove</button></div>`
               :`<div class="slot"><div class="muted fd" style="font-size:22px">${i+1}</div><div class="muted small">empty</div></div>`}).join("");
    const full=list.length>=3;
    const custom=`<div class="cbox" data-cbox style="${cs.open&&!full?'':'display:none'}">
        <div class="fd ctitle">✍️ ${mode==='B'?'Bring anything':'Something else'}</div>
        <div class="crow"><div class="cprev" id="cprev">✨</div>
          <input type="text" id="cn" class="cinput" placeholder="What would you bring? e.g. A lifetime supply of coffee" maxlength="40" autocomplete="off"></div>
        <div class="clbl">What kind of item is it?</div>
        <div class="ccats" id="ccats"></div>
        <div class="clbl">Pick an emoji <span class="muted small" style="font-weight:600">— matched to what you typed and the type you chose</span></div>
        <div class="muted small" id="esugl" style="margin:-2px 0 8px"></div>
        <div class="esug" id="esug"></div>
        <details class="emore"><summary>More emojis…</summary><div id="egrid">${Object.entries(CATS).map(([k,c])=>`<div class="egh" style="color:${c.color}">● ${c.label}</div><div class="egrid">${CAT_EMOJI[k].map(e=>`<button type="button" class="ebtn" data-e="${e}">${e}</button>`).join("")}</div>`).join("")}<div class="egh">● Everything else</div><div class="egrid">${EMOJI_PALETTE.filter(e=>!Object.values(CAT_EMOJI).flat().includes(e)).map(e=>`<button type="button" class="ebtn" data-e="${e}">${e}</button>`).join("")}</div></div></details>
        <div class="err" id="cerr"></div>
        <div class="cfoot"><button type="button" class="btn" id="cadd">Add to my 3 ➕</button></div>
      </div>`;
    el.innerHTML=`<div class="picked">${slots}</div>
      ${mode==='B'?custom+`<div class="fd" style="font-size:18px;margin-top:14px">…or grab something from the crate</div>`:''}
      <div class="legend">${legend()}</div>
      <div class="grid">${ITEMS.map((it,i)=>itemCard(it,list.some(m=>m.n===it.n),full&&!list.some(m=>m.n===it.n),i)).join("")}
        ${mode==='A'?`<div class="item other ${full?'dim':''}" data-other="1"><div class="em">✍️</div><div class="nm">Something else…<br><span class="muted small" style="font-family:Nunito,system-ui,-apple-system,'Segoe UI',sans-serif">type anything + pick an emoji</span></div></div>`:''}</div>
      ${mode==='A'?custom:''}`;
    el.querySelectorAll(".grid .item[data-i]").forEach(c=>c.onclick=()=>{
      const it=ITEMS[+c.dataset.i];const k=list.findIndex(m=>m.n===it.n);
      if(k>=0){list.splice(k,1);play("unpick")}else if(list.length<3){list.push({...it,why:""});play("pick")}else return;
      draw();onChange();
    });
    const ob=el.querySelector("[data-other]");
    if(ob)ob.onclick=()=>{if(list.length>=3)return;cs.open=true;const b=el.querySelector("[data-cbox]");b.style.display="";if(b.scrollIntoView)b.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>el.querySelector("#cn").focus(),300);play("pick")};
    el.querySelectorAll("[data-why]").forEach(inp=>inp.oninput=()=>{list[+inp.dataset.why].why=inp.value;onChange(true)});
    el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{list.splice(+b.dataset.rm,1);play("unpick");draw();onChange()});
    // custom box
    const inp=el.querySelector("#cn");
    if(inp){
      inp.value=cs.text;
      inp.oninput=()=>{cs.text=inp.value;upd()};
      inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};
      el.querySelector("#cadd").onclick=add;
      el.querySelectorAll("#egrid [data-e]").forEach(b=>b.onclick=()=>{cs.emoji=b.dataset.e;play("emoji");upd(true)});
      upd();
    }
  };
  const cur=()=>{const sug=suggestEmojis(cs.text);const cat=cs.cat||guessCat(cs.text);return {sug,cat,em:cs.emoji||sug[0]||CAT_EM[cat]}};
  function upd(bump){
    const {sug,cat,em}=cur();
    const pv=el.querySelector("#cprev");if(!pv)return;pv.textContent=em;
    if(bump){pv.classList.add("bump");setTimeout(()=>pv.classList.remove("bump"),160)}
    let opts=[...new Set([em,...sug,...CAT_EMOJI[cat]])].slice(0,16);
    el.querySelector("#esug").innerHTML=opts.map(e=>`<button type="button" class="ebtn ${e===em?'on':''}" data-e="${e}">${e}</button>`).join("");
    el.querySelector("#esugl").innerHTML=(sug.length?`✨ Best matches for “${esc(cs.text.trim().slice(0,24))}”, then `:"")+`ideas for <b style="color:${CATS[cat].color}">${CATS[cat].label}</b>`;
    el.querySelectorAll("#esug [data-e]").forEach(b=>b.onclick=()=>{cs.emoji=b.dataset.e;play("emoji");upd(true)});
    el.querySelectorAll("#egrid [data-e]").forEach(b=>b.classList.toggle("on",b.dataset.e===em));
    el.querySelector("#ccats").innerHTML=Object.entries(CATS).map(([k,c])=>`<button type="button" class="ccat ${k===cat?'on':''}" data-c="${k}" style="--ccol:${c.color}"><span style="color:${c.color}">●</span> ${c.label}</button>`).join("");
    el.querySelectorAll("#ccats [data-c]").forEach(b=>b.onclick=()=>{cs.cat=b.dataset.c;upd(true)});
  }
  function add(){
    const er=el.querySelector("#cerr");const n=cs.text.trim();
    if(!n){er.textContent="Type what you'd bring first.";el.querySelector("#cn").focus();return}
    if(list.length>=3){er.textContent="Already 3 items — remove one first.";return}
    if(list.some(m=>m.n.toLowerCase()===n.toLowerCase())){er.textContent="You already have that one!";return}
    if(/\b(boat|phone|smartphone|iphone|helicopter|plane|yacht|raft|jet ?ski|satellite)\b/i.test(n)){er.textContent="Nice try 😄 No boats, working phones or ways to escape!";return}
    const {cat,em}=cur();
    list.push({n:n.slice(0,40),e:em,c:cat,why:"",custom:true});
    cs=fresh();play("pick");draw();onChange();
  }
  draw();
}
function beachHTML(picks,sc){

/* entries: [{name, picks}] */
function resultsHTML(entries){
  const all=entries.flatMap(p=>p.picks);
  const counts={survival:0,tools:0,comfort:0,personal:0};all.forEach(i=>{if(counts[i.c]!==undefined)counts[i.c]++});
  const total=all.length||1;
  const byItem={};entries.forEach(p=>p.picks.forEach(i=>{const k=i.n.toLowerCase();(byItem[k]=byItem[k]||{n:i.n,e:i.e,k:0,who:[]});byItem[k].k++;byItem[k].who.push(p.name)}));
  const ranked=Object.values(byItem).sort((a,b)=>b.k-a.k);
  const top=ranked[0];const uniques=ranked.filter(r=>r.k===1);
  const unpicked=ITEMS.filter(i=>!byItem[i.n.toLowerCase()]);
  const groups={survival:[],tools:[],comfort:[],personal:[],balanced:[]};
  entries.forEach(p=>{const c={};p.picks.forEach(i=>c[i.c]=(c[i.c]||0)+1);
    const best=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
    if(!best||best[1]<2||!groups[best[0]])groups.balanced.push(p.name);else groups[best[0]].push(p.name)});
  const sv=counts.survival+counts.tools, cf=counts.comfort+counts.personal;
  const verdict=sv>cf?"This group leans <b>practical</b> — you'd survive, but would you have fun?":cf>sv?"This group leans <b>comfort & heart</b> — great vibes, questionable survival odds.":"A perfectly <b>balanced</b> island — survival and soul in equal measure.";
  return `<h2 style="font-size:32px;margin-top:0">📊 Island patterns</h2>
    <p style="font-size:18px">${verdict}</p>
    <div class="bars">${Object.entries(CATS).map(([k,c])=>`<div class="bar"><span>${c.label}</span><div class="track"><div class="fill" data-w="${counts[k]/total*100}" style="width:0;background:${c.color}"></div></div><span>${counts[k]}</span></div>`).join("")}</div>
    <div class="stats">
      <div class="stat"><div class="lbl">Most popular</div><div class="big">${top?`${esc(top.e)} ${esc(top.n)}`:'—'}</div><div class="muted small">${top?`picked ${top.k}×`:''}</div></div>
      <div class="stat"><div class="lbl">One-of-a-kind picks</div><div class="big">${uniques.length}</div><div class="muted small">${uniques.slice(0,4).map(u=>`${esc(u.e)} ${esc(u.n)} (${esc(u.who[0])})`).join(" · ")}</div></div>
      <div class="stat"><div class="lbl">Left in the crate</div><div class="big">${unpicked.length?unpicked.slice(0,5).map(i=>i.e).join(" "):'Nothing!'}</div><div class="muted small">${unpicked.length?`Nobody took the ${esc(unpicked[0].n.toLowerCase())}…`:'Every item found a home.'}</div></div>
    </div>
    <h2>Who's who on the island</h2>
    <div class="archs">
      ${Object.entries(CATS).filter(([k])=>groups[k].length).map(([k,c])=>`<div class="arch" style="border-color:${c.color}"><h3>${c.archEm} ${c.arch}</h3><div class="muted small">${c.desc}</div><div class="who" style="margin-top:8px">${groups[k].map(esc).join(", ")}</div></div>`).join("")}
      ${groups.balanced.length?`<div class="arch" style="border-color:var(--sun)"><h3>⚖️ The All-Rounder</h3><div class="muted small">A bit of everything — body, mind and heart.</div><div class="who" style="margin-top:8px">${groups.balanced.map(esc).join(", ")}</div></div>`:''}
    </div>
    <h2>Talk about it 💬</h2>
    <ul class="prompts">
      <li>What do our picks say about how we handle stress — or a new project?</li>
      <li>${top&&top.k>1?`Why did ${top.k} of you grab the ${esc(top.n.toLowerCase())}?`:"Nobody doubled up — what does that say about this group?"}</li>
      <li>Which pick surprised you the most?</li>
      <li>If we were all on the same island, which three items would the team keep?</li>
    </ul>`;
}

const TEAM_NAMES=["Coconut","Driftwood","Seagull","Lagoon","Starfish","Mango","Pelican","Reef","Tidepool","Hammock","Compass","Bonfire","Pineapple","Turtle"];
const teamName=i=>"Team "+TEAM_NAMES[i%TEAM_NAMES.length]+(i>=TEAM_NAMES.length?" "+(Math.floor(i/TEAM_NAMES.length)+1):"");
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function randomTeams(ids){const x=shuffleArr(ids),t=[];for(let i=0;i+1<x.length;i+=2)t.push([x[i],x[i+1]]);
  if(x.length%2){if(t.length)t[t.length-1].push(x[x.length-1]);else t.push([x[x.length-1]])}
  return t.map(m=>({members:m,keep:[],done:false}))}
function teamPool(team,byId){return team.members.flatMap(m=>((byId[m]||{}).picks||[]).map((it,i)=>({key:m+":"+i,it,owner:(byId[m]||{}).name||"?"})))}
function teamLimit(team,byId,pair,trio){return Math.min(teamPool(team,byId).length,team.members.length>=3?trio:pair)}
function teamsReady(players,teams){const a=new Set(teams.flatMap(t=>t.members));return players.length>0&&players.every(p=>a.has(p.id))&&teams.every(t=>t.members.length>=2||players.length<2)}
const nameOf=(byId,id)=>(byId[id]||{}).name||"?";

  <div class="gal">${entries.map((e,i)=>`<div class="gcard ${host?'click':''} ${spot===i?'on':''}" data-gi="${i}"><div class="gname">${esc(e.name)}${e.id===NET.me&&O.code?' <span class="muted small">(you)</span>':''}</div>

}
let spotShown=null;
function hideSpot(){const el=document.getElementById("spot");if(el){el.className="spot";el.innerHTML=""}spotShown=null}

    <div class="spoth">${esc(e.name)}</div>

    <div class="spoti">${e.picks.map((it,k)=>`<div style="border-color:${(CATS[it.c]||CATS.comfort).color};animation-delay:${k*.2}s"><div class="se2">${esc(it.e)}</div><div><div class="sn">${esc(it.n)}</div>${it.why?`<div class="sw">“${esc(it.why)}”</div>`:''}</div></div>`).join("")}</div>
    ${host?`<div class="spotnav"><button class="btn sec" id="spv" ${i===0?'disabled':''}>← Previous</button><button class="btn sec" id="spx">Show everyone</button><button class="btn" id="spn">${i>=entries.length-1?'Done ✓':'Next person →'}</button></div>`:`<p class="muted center small" style="margin:0">The host moves the spotlight.</p>`}</div>`;

let TSEL=null;
function numStep(id,v,min,max){return `<span class="numstep"><button type="button" data-st="${id}" data-d="-1" ${v<=min?'disabled':''} aria-label="fewer">−</button><b>${v}</b><button type="button" data-st="${id}" data-d="1" ${v>=max?'disabled':''} aria-label="more">+</button></span>`}
function teamsBuilderHTML(players,teams,pair,trio){
  const byId=Object.fromEntries(players.map(p=>[p.id,p]));
  const used=new Set(teams.flatMap(t=>t.members));const pool=players.filter(p=>!used.has(p.id));

      <div class="muted small" style="margin-top:6px">${t.members.length} ${t.members.length===1?'person — needs a partner':'people'} · keeps ${t.members.length>=3?trio:pair} items</div></div>`).join("")}

function bindTeamsBuilder(players,st,commit,rerender){
  app.querySelectorAll("[data-pp]").forEach(b=>b.onclick=()=>{TSEL=TSEL===b.dataset.pp?null:b.dataset.pp;rerender()});
  app.querySelectorAll("[data-tm]").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.tm;
    commit({teams:st.teams.map(t=>({members:t.members.filter(m=>m!==id),keep:[],done:false})).filter(t=>t.members.length)})});
  app.querySelectorAll("[data-ti]").forEach(c=>c.onclick=()=>{if(!TSEL){toast("Tap a name first, then the team.");return}
    const teams=st.teams.map(t=>({members:t.members.slice(),keep:[],done:false}));
    if(c.dataset.ti==="new")teams.push({members:[TSEL],keep:[],done:false});
    else{const t=teams[+c.dataset.ti];if(t.members.length>=3){toast("A team can have at most 3 people.");return}t.members.push(TSEL)}
    TSEL=null;play("join");commit({teams})});
  $("#rndt").onclick=()=>{TSEL=null;play("join");commit({teams:randomTeams(players.map(p=>p.id))})};
  $("#clrt").onclick=()=>{TSEL=null;commit({teams:[]})};
  app.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const k=b.dataset.st==="kp"?"keepPair":"keepTrio";commit({[k]:st[k]+ +b.dataset.d,teams:st.teams.map(t=>({members:t.members,keep:[],done:false}))})});
}
function teamKeepHTML(t,i,byId,lim,editable,mine){
  const pool=teamPool(t,byId);
  return `<div class="tkeep ${mine?'mine':''}"><div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><div class="tname" style="margin:0">${teamName(i)} ${t.done?'✅':''} ${mine?'<span class="pill" style="vertical-align:middle">your team</span>':''}</div><div class="muted small">${t.members.map(m=>esc(nameOf(byId,m))).join(" · ")}</div></div>
      <div class="kcount ${t.keep.length===lim?'full':''}">${t.keep.length} / ${lim} kept</div></div>
    <div class="kgrid">${pool.map(x=>{const on=t.keep.includes(x.key);return `<button type="button" class="kitem ${on?'on':''} ${!on&&t.keep.length>=lim?'dim':''}" data-tk="${i}" data-k="${esc(x.key)}" ${editable?'':'disabled'}><span class="ke">${esc(x.it.e)}</span><span class="kn">${esc(x.it.n)}</span><span class="ko">${esc(x.owner)}'s</span></button>`}).join("")}</div>
    ${editable?`<div class="row" style="justify-content:flex-end;margin-top:10px"><span class="muted small">${t.done?'Locked in — the host will reveal soon.':t.keep.length<lim?`Choose ${lim-t.keep.length} more`:'Happy with these?'}</span><button type="button" class="btn sm ${t.done?'sec':''}" data-done="${i}" ${!t.done&&t.keep.length!==lim?'disabled':''}>${t.done?'↩️ Change our picks':"✅ We're done"}</button></div>`:''}</div>`;
}
function bindTeamKeep(teams,byId,limFn,onKeep,onDone){
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const i=+b.dataset.tk,t=teams[i],k=b.dataset.k,lim=limFn(t);
    let keep=t.keep.slice();if(keep.includes(k)){keep=keep.filter(x=>x!==k);play("unpick")}else{if(keep.length>=lim){toast(`You can only keep ${lim} — drop one first.`);return}keep.push(k);play("pick")}
    onKeep(i,keep)});
  app.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const i=+b.dataset.done;play("lock");onDone(i,!teams[i].done)});
}

/* ---------- ONLINE MODE (peer-to-peer: the host's browser runs the game) ---------- */
const OSTEPS=["Lobby","Island","Think","Share","Gallery","Patterns","Teams","Team pick","Reveal"];
const PHASES=["lobby","scenario","think","share","gallery","results","teams","teamkeep","teamreveal"];
const PREFIX="np0island-v1-";
const O={code:null,role:null,game:null,players:[],draft:[],draftKey:"",viewKey:"",lastTwist:null,nick:"",peer:null,conns:{},conn:null,loaded:false,loadTimer:null,retry:null};
let HS=null; // host-only authoritative state {game, players:{id:{...}}}
const genCode=()=>Array.from({length:4},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[rand(31)]).join("");
const joinLink=c=>location.origin+location.pathname+"#"+c;
const isHost=()=>O.role==="host";
const myDoc=()=>O.players.find(p=>p.id===NET.me);
const joined=()=>!!myDoc();
const inRound=p=>p.round===O.game.round;
const lockedPlayers=()=>O.players.filter(p=>inRound(p)&&p.locked&&Array.isArray(p.picks)&&p.picks.length===3).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
function setNet(txt,kind){const el=$("#netst");if(!el)return;el.textContent=txt||"";el.style.display=txt?"inline-block":"none";el.style.background=kind==="bad"?"#ffe1d6":kind==="ok"?"#e6f6ee":"#fff6df"}
const str=(v,n)=>String(v??"").slice(0,n);
function sanitizePicks(a){if(!Array.isArray(a))return[];return a.slice(0,3).map(x=>({n:str(x&&x.n,40).trim(),e:str(x&&x.e,16),c:CATS[x&&x.c]?x.c:"comfort",why:str(x&&x.why,80)})).filter(x=>x.n)}
function parse(d){try{const m=typeof d==="string"?JSON.parse(d):d;return m&&typeof m==="object"?m:null}catch(e){return null}}

/* host side */
function hostPublish(){
  store.set("np0-host-"+O.code,JSON.stringify(HS));
  O.game=HS.game;O.players=Object.entries(HS.players).map(([id,p])=>({id,...p}));
  const msg=JSON.stringify({t:"state",game:HS.game,players:O.players});
  Object.values(O.conns).forEach(c=>{try{if(c.open)c.send(msg)}catch(e){}});
  checkTwist();renderOnline();
}
function hostById(){const g=HS.game;const o={};Object.entries(HS.players).forEach(([id,p])=>{if(p.round===g.round&&Array.isArray(p.picks)&&p.picks.length)o[id]={id,name:p.nick||'Castaway',picks:p.picks}});return o}
function gset(patch){if(!isHost())return;Object.assign(HS.game,patch);hostPublish()}
function applyAction(id,a){
  const g=HS.game;let p=HS.players[id];
  if(a.t==="join"){const nick=str(a.nick,24).trim()||"Castaway";
    if(p){p.nick=nick;p.online=true}else{if(Object.keys(HS.players).length>=30)return;HS.players[id]={nick,joinedAt:Date.now(),round:g.round,picks:[],locked:false,online:true}}}
  else if(a.t==="hello"){if(p)p.online=true;else{sendState(id);return}}
  else if(!p)return;
  else if(a.t==="lock"){const picks=sanitizePicks(a.picks);if(picks.length!==3)return;Object.assign(p,{picks,locked:true,round:g.round})}
  else if(a.t==="unlock"){p.locked=false}
  else if(a.t==="leave"){delete HS.players[id]}
  else if(a.t==="teamkeep"||a.t==="teamdone"){
    const ti=+a.ti,t=(g.teams||[])[ti];if(!t||g.phase!=="teamkeep")return;
    if(id!==g.host&&!t.members.includes(id))return;
    const byId=hostById();const lim=teamLimit(t,byId,g.keepPair||3,g.keepTrio||4);const valid=new Set(teamPool(t,byId).map(x=>x.key));
    if(a.t==="teamkeep"){t.keep=[...new Set((Array.isArray(a.keep)?a.keep:[]).map(x=>str(x,80)).filter(x=>valid.has(x)))].slice(0,lim);t.done=false}
    else t.done=!!a.done&&t.keep.length===lim}
  else return;
  hostPublish();
}
function sendState(id){const c=O.conns[id];try{if(c&&c.open)c.send(JSON.stringify({t:"state",game:HS.game,players:O.players}))}catch(e){}}
function createLobby(nick){
  if(!nick){$("#herr").textContent="Enter your name first.";return}
  store.set("np0-nick",nick);
  HS={game:{host:NET.me,phase:"lobby",mode:"A",think:120,scenario:"tropical",active:"tropical",round:1,order:[],turn:0,q:"",twist:null,thinkEnd:0},
      players:{[NET.me]:{nick,joinedAt:Date.now(),round:1,picks:[],locked:false,online:true}}};
  startHost(genCode(),true);
}
function startHost(code,fresh){
  const hs=HS;leaveOnline(true);HS=hs;
  O.code=code;O.role="host";O.loaded=false;O.viewKey="";O.lastTwist=null;setHash(code);
  app.innerHTML=`<div class="panel center"><h2>Building your island ${esc(code)}… 🛠️</h2><p class="muted" id="loadmsg"></p></div>`;
  setNet("Connecting…");
  const peer=new Peer(PREFIX+code);O.peer=peer;
  peer.on("open",()=>{O.loaded=true;setNet("🟢 Hosting — keep this tab open","ok");hostPublish()});
  peer.on("connection",c=>{
    c.on("data",d=>{const m=parse(d);if(!m)return;
      if(!c._pid){c._pid=str(m.from,40);if(!c._pid)return;const old=O.conns[c._pid];O.conns[c._pid]=c;if(old&&old!==c)try{old.close()}catch(e){}}
      if(m.t==="hello"){applyAction(c._pid,{t:"hello"});sendState(c._pid);return}
      applyAction(c._pid,m);});
    c.on("close",()=>{const id=c._pid;if(id&&O.conns[id]===c){delete O.conns[id];if(HS.players[id]){HS.players[id].online=false;hostPublish()}}});
  });
  peer.on("disconnected",()=>{setNet("Reconnecting…");setTimeout(()=>{try{if(O.peer===peer&&!peer.destroyed)peer.reconnect()}catch(e){}},1500)});
  peer.on("error",e=>{
    if(O.peer!==peer)return;
    if(e.type==="unavailable-id"){
      if(fresh&&!O.loaded){try{peer.destroy()}catch(x){}startHost(genCode(),true);return}
      setNet("Re-opening your lobby…");clearTimeout(O.retry);O.retry=setTimeout(()=>{if(O.peer===peer){try{peer.destroy()}catch(x){}startHost(code,false)}},3000);return}
    if(e.type==="peer-unavailable")return;
    setNet("⚠️ Connection problem — retrying","bad");console.warn(e);
  });
}
/* player side */
function joinAsPlayer(code,nick){
  leaveOnline(true);
  O.code=code;O.role="player";O.nick=nick||"";O.loaded=false;O.viewKey="";O.lastTwist=null;setHash(code);
  app.innerHTML=`<div class="panel center"><h2>Paddling to island ${esc(code)}… 🛶</h2><p class="muted" id="loadmsg"></p></div>`;
  setNet("Connecting…");
  const peer=new Peer();O.peer=peer;
  O.loadTimer=setTimeout(()=>{if(!O.loaded)notFound()},15000);
  peer.on("open",()=>connectHost());
  peer.on("disconnected",()=>{setTimeout(()=>{try{if(O.peer===peer&&!peer.destroyed)peer.reconnect()}catch(e){}},1500)});
  peer.on("error",e=>{
    if(O.peer!==peer)return;
    if(e.type==="peer-unavailable"){if(!O.loaded)notFound();else{setNet("🔴 Lost the host — retrying…","bad");scheduleReconnect()}return}
    setNet("⚠️ Connection problem — retrying","bad");console.warn(e);if(O.loaded)scheduleReconnect();
  });
}
function scheduleReconnect(){clearTimeout(O.retry);O.retry=setTimeout(()=>{if(O.role==="player"&&O.peer&&!O.peer.destroyed)connectHost()},3000)}
function connectHost(){
  const c=O.peer.connect(PREFIX+O.code,{reliable:true});O.conn=c;
  c.on("open",()=>{if(O.conn!==c)return;c.send(JSON.stringify({t:"hello",from:NET.me}));
    if(O.nick)c.send(JSON.stringify({t:"join",nick:O.nick,from:NET.me}));});
  c.on("data",d=>{if(O.conn!==c)return;const m=parse(d);if(!m||m.t!=="state"||!m.game)return;
    clearTimeout(O.loadTimer);
    if(!O.loaded){O.loaded=true;const me=Array.isArray(m.players)&&m.players.find(p=>p.id===NET.me);if(me&&!O.nick)O.nick=me.nick}
    setNet("🟢 Connected","ok");
    O.game=m.game;O.players=Array.isArray(m.players)?m.players:[];checkTwist();renderOnline();});
  c.on("close",()=>{if(O.conn!==c||O.role!=="player")return;setNet("🔴 Lost the host — retrying…","bad");scheduleReconnect()});
  c.on("error",()=>{if(O.conn===c&&O.loaded)scheduleReconnect()});
}
function notFound(){
  if(O.role!=="player"||O.loaded)return;
  clearTick();stepper(null);setNet("");
  app.innerHTML=`<div class="panel center"><h2>Can't find island ${esc(O.code)} 🌫️</h2>
    <p class="muted">Check the code with your host. The host's browser tab needs to stay open for the game to run.<br>Some strict office networks or VPNs block direct connections — if it keeps failing, try phone data or another network.</p>
    <div class="row" style="justify-content:center"><button class="btn sec" id="hb">Back</button><button class="btn" id="rt">Try again</button></div></div>`;
  $("#hb").onclick=()=>{leaveOnline();home()};const c=O.code,n=O.nick;$("#rt").onclick=()=>joinAsPlayer(c,n);
}
function act(a){
  if(isHost()){applyAction(NET.me,a);return}
  if(O.conn&&O.conn.open){try{O.conn.send(JSON.stringify({...a,from:NET.me}));return}catch(e){}}
  toast("Reconnecting to the host — try again in a moment.");
}
function checkTwist(){
  const ts=(O.game&&O.game.twist&&O.game.twist.ts)||0;
  if(O.lastTwist===null){O.lastTwist=ts;return}
  if(ts>O.lastTwist){O.lastTwist=ts;showOverlay(twistHTML(TWISTS[O.game.twist.i]||TWISTS[0]))}
}
function leaveOnline(keepHash){
  clearTick();hideTimerBar();clearTimeout(O.loadTimer);clearTimeout(O.retry);
  try{if(O.peer)O.peer.destroy()}catch(e){}
  O.peer=null;O.conn=null;O.conns={};O.code=null;O.role=null;O.game=null;O.players=[];HS=null;setNet("");
  if(!keepHash)setHash("");
}
function renderOnline(){
  if(!O.code||!O.game)return;
  const g=O.game,me=myDoc();
  stepper(OSTEPS,PHASES.indexOf(g.phase));
  applyTheme(g.phase==="lobby"?null:(g.active||"tropical"));
  const key=[g.phase,g.round,g.turn,g.q,(g.order||[]).join(","),isHost(),!!me,me&&inRound(me)&&me.locked,g.mode,g.think,g.scenario,g.active,g.thinkEnd,g.phase==="results"?lockedPlayers().map(p=>p.id+JSON.stringify(p.picks)).join("|"):"",g.spot,JSON.stringify(g.teams||[]),g.keepPair,g.keepTrio,g.phase==="share"?JSON.stringify((O.players.find(p=>p.id===(g.order||[])[g.turn])||{}).picks||[]):""].join("~");
  if(key!==O.viewKey){O.viewKey=key;clearTick();hideTimerBar();if(g.phase!=="gallery")hideSpot();({lobby:oLobby,scenario:oScenario,think:oThink,share:oShare,gallery:oGallery,results:oResults,teams:oTeams,teamkeep:oTeamKeep,teamreveal:oTeamReveal}[g.phase]||oLobby)()}
  refreshLive();
}
function playersHTML(){
  const g=O.game;
  return O.players.slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)).map(p=>{
    const st=g.phase==="think"?(inRound(p)&&p.locked?"✅":"⏳"):"";
    return `<span class="ptag ${p.id===NET.me?'me':''}" style="padding-right:14px;${p.online===false?'opacity:.5':''}" title="${p.online===false?'disconnected':''}">${st?`<span class="st">${st}</span>`:''}${esc(p.nick||"Castaway")}${p.id===g.host?' <span class="pill host" style="padding:1px 8px">host</span>':''}${p.id===NET.me?' <span class="muted small">(you)</span>':''}</span>`}).join("")||`<span class="muted">Nobody here yet.</span>`;
}
function refreshLive(){
  const n0=O.players.length;if(O.lastCount!==undefined&&n0>O.lastCount&&O.game.phase==="lobby")play("join");O.lastCount=n0;
  const el=$("#oplayers");if(el)el.innerHTML=playersHTML();
  const c=$("#ocount");if(c){const n=O.players.length;const l=lockedPlayers().length;c.textContent=O.game.phase==="think"?`${l} of ${n} locked in`:`${n} castaway${n===1?'':'s'} on the island`}
  const sb=$("#startshare");if(sb)sb.disabled=lockedPlayers().length<1;
  const st=$("#startb");if(st)st.disabled=O.players.length<1;
}
function joinBox(){
  const nick=O.nick||store.get("np0-nick")||"";
  return `<div class="hc" style="max-width:420px;margin:14px auto"><h3>Join this game</h3>
    <input type="text" id="ojn" placeholder="Your name" maxlength="24" value="${esc(nick)}"><button class="btn" id="ojb">Join 🏝️</button><div class="err" id="ojerr"></div></div>`;
}
function bindJoinBox(){const b=$("#ojb");if(!b)return;b.onclick=()=>{const n=$("#ojn").value.trim();if(!n){$("#ojerr").textContent="Enter your name.";return}store.set("np0-nick",n);O.nick=n;act({t:"join",nick:n})}}
function hostOnly(html){return isHost()?`<div class="hostbar"><div class="lbl">🎙️ Host controls</div>${html}</div>`:""}
function leaveBtn(){return isHost()?`<button class="btn sec sm" id="leaveb">End game</button>`:`<button class="btn sec sm" id="leaveb">Leave game</button>`}
function bindLeave(){const b=$("#leaveb");if(b)b.onclick=()=>{if(isHost()){store.del("np0-host-"+O.code)}else if(myDoc())act({t:"leave"});setTimeout(()=>{leaveOnline();home()},200)}}

function oLobby(){
  const g=O.game,link=joinLink(O.code);
  app.innerHTML=`<div class="panel center">
    <div class="muted fd" style="font-size:18px">Lobby code</div>
    <div class="code">${esc(O.code)}</div>
    <div class="linkbox"><code>${esc(link)}</code><button class="btn sm" id="cpl">Copy link</button></div>
    <p class="muted small">Send the link to your team. Everyone opens it, types their name, and appears below.</p>
    ${joined()?'':joinBox()}
    <h3 id="ocount" style="margin-bottom:4px"></h3>
    <div class="players" id="oplayers" style="justify-content:center"></div>
    ${isHost()?`<div class="hostbar" style="text-align:left"><div class="lbl">🎙️ Host controls</div>
      <div class="fd" style="font-size:18px">Island</div>${scenarioPickerHTML(g.scenario||"tropical")}
      <div class="fd" style="font-size:18px">Mode</div>${modesHTML(g.mode)}
      <div class="fd" style="font-size:18px;margin-bottom:8px">Think time</div>${thinkHTML(g.think)}
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="startb">Everyone's here — start! 🚀</button></div></div>`
      :`<p class="fd" style="font-size:20px;margin-top:18px">⏳ Waiting for the host to start…</p><p class="muted">Island: ${g.scenario==='random'||!g.scenario?'🎲 Mystery island':scOf(g.scenario).em+' '+esc(scOf(g.scenario).name)} · Mode: ${g.mode==='A'?'📋 The crate':'✨ Anything goes'} · Think time: ${g.think/60} min</p>`}
    <div style="margin-top:14px">${leaveBtn()}</div>
  </div>`;
  $("#cpl").onclick=()=>copyText(link,"Link copied — share it with your team!");
  bindJoinBox();bindLeave();
  if(isHost()){bindModes(m=>gset({mode:m}));bindThink(t=>gset({think:t}));bindScenarios(x=>gset({scenario:x}));$("#startb").onclick=()=>gset({phase:"scenario",active:resolveSc(g.scenario||"tropical")})}
}
function oScenario(){
  const g=O.game;
  app.innerHTML=`<div class="panel center">${g.scenario==='random'?'<div class="fd" style="font-size:20px;margin-bottom:6px">🎲 Your random island is…</div>':''}${briefingHTML(scOf(g.active))}
    <div class="facts"><span class="chip">${g.mode==='A'?'📋 Pick from the crate (or invent your own)':'✨ Anything you can carry'}</span><span class="chip">⏱️ ${g.think/60} min to decide</span></div>
    ${joined()?'':joinBox()}
    ${isHost()?hostOnly(`<div class="row" style="justify-content:center"><button class="btn sec sm" id="bk">← Back to lobby</button><button class="btn" id="go">Start the ${O.game.think/60}-min think timer ⏱️</button></div>`):`<p class="fd" style="font-size:20px">Get ready… the host will start the timer.</p>`}
  </div>`;
  bindJoinBox();
  const ik=O.code+"/"+g.round+"/"+g.active;if(O.introKey!==ik){O.introKey=ik;playIntro(scOf(g.active))}
  if(isHost()){$("#bk").onclick=()=>gset({phase:"lobby"});$("#go").onclick=()=>gset({phase:"think",thinkEnd:Date.now()+O.game.think*1000})}
}
function oThink(){
  const g=O.game,me=myDoc();
  const dk=O.code+"/"+g.round;
  if(O.draftKey!==dk){O.draftKey=dk;O.draft=me&&inRound(me)&&Array.isArray(me.picks)?me.picks.map(x=>({...x})):[]}
  const locked=me&&inRound(me)&&me.locked;
  app.innerHTML=`<div class="panel">
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
      <div><h2 style="margin:0">Pick your 3 items 🤫</h2><p class="muted" style="margin:4px 0 0">${scOf(g.active).em} ${esc(scOf(g.active).name)} · ${esc(scOf(g.active).dur)}. Choose on your own device — nobody sees your picks until the share round.</p></div>
    </div>
    <div class="hint" id="hint">💡 ${pick(HINTS)}</div>
    ${!me?joinBox():locked?`<div class="locked">🔒 Locked in! ${O.draft.map(i=>`${esc(i.e)} ${esc(i.n)}`).join(" · ")}<div style="margin-top:10px"><button class="btn sec sm" id="unlock">✏️ Change my picks</button></div></div>`
      :`<div id="picker"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><span class="muted small" id="lockhint"></span><button class="btn" id="lockb">🔒 Lock in my 3</button></div>`}
    <h3 id="ocount" style="margin-bottom:4px"></h3><div class="players" id="oplayers"></div>
    ${hostOnly(`<div class="row" style="justify-content:space-between"><button class="btn sec sm" id="addt">+30 seconds</button><button class="btn" id="startshare">Start the share round 🎤</button></div><div class="muted small" style="margin-top:6px">Only players who locked in will be in the share round.</div>`)}
  </div>`;
  bindJoinBox();
  const total=g.think;
  const sc=scOf(g.active);showTimerBar(`${sc.em} ${sc.name}`);
  const upd=()=>{const left=(g.thinkEnd-Date.now())/1000;timerTick(left,total);
    if(left<=0&&$("#hint")&&!O.tu){O.tu=1;$("#hint").textContent="⏰ Time's up! Lock in your three."}};
  O.tu=0;upd();let n=0;tick=setInterval(()=>{upd();if(++n%25===0&&!O.tu)$("#hint").textContent="💡 "+pick(HINTS)},1000);
  if(me&&!locked){
    const lb=$("#lockb"),lh=$("#lockhint");
    const st=()=>{lb.disabled=O.draft.length<3;lh.textContent=O.draft.length<3?`${3-O.draft.length} more to go `:""};
    mountPicker($("#picker"),O.draft,g.mode,st);st();
    lb.onclick=()=>{const picks=O.draft.map(({n,e,c,why})=>({n,e,c,why:(why||"").slice(0,80)}));play("lock");act({t:"lock",picks})};
  }
  const ub=$("#unlock");if(ub)ub.onclick=()=>act({t:"unlock"});
  if(isHost()){
    $("#addt").onclick=()=>gset({thinkEnd:Math.max(Date.now(),g.thinkEnd)+30000});
    $("#startshare").onclick=()=>{const order=lockedPlayers().map(p=>p.id);if(!order.length)return;gset({phase:"share",order,turn:0,q:pick(QUESTIONS)})};
  }
}
function oShare(){
  const g=O.game,order=g.order||[];
  const pid=order[g.turn];const p=O.players.find(x=>x.id===pid);
  const last=g.turn>=order.length-1;
  const name=p?p.nick:"A castaway who left";
  const picks=p&&inRound(p)&&Array.isArray(p.picks)?p.picks:[];
  app.innerHTML=`<div class="panel">
    ${pid===NET.me?`<div class="yourturn">🎤 It's your turn! Tell everyone why you picked these.</div>`:''}
    <div class="turnhead"><h2>🏝️ ${esc(name)} brought…</h2><div class="progress">Castaway ${g.turn+1} of ${order.length}</div></div>
    ${picks.length?beachHTML(picks,scOf(g.active)):`<p class="muted">Their crate floated away (they left the game).</p>`}
    <div class="q"><span class="qi">❓</span><span>${esc(g.q)}</span></div>
    ${hostOnly(`<div class="row" style="justify-content:space-between"><div class="row"><button class="btn sec sm" id="pv" ${g.turn===0?'disabled':''}>← Previous</button><button class="btn sec sm" id="qb">Another question</button></div><button class="btn" id="nb">${last?"See everyone's items 🖼️":'Next castaway →'}</button></div>`)}
    ${isHost()?'':`<p class="muted center">The host moves to the next castaway.</p>`}
  </div>`;
  if(pid===NET.me)play("turn");if(picks.length)[0,350,700].forEach(d=>play("splash",d+150));
  if(isHost()){
    $("#qb").onclick=()=>{let nq;do{nq=pick(QUESTIONS)}while(nq===g.q);gset({q:nq})};
    $("#pv").onclick=()=>gset({turn:Math.max(0,g.turn-1),q:pick(QUESTIONS)});
    $("#nb").onclick=()=>gset(last?{phase:"gallery",spot:-1}:{turn:g.turn+1,q:pick(QUESTIONS)});
  }
}
function oResults(){
  const g=O.game,order=g.order||[];
  const entries=order.map(id=>O.players.find(p=>p.id===id)).filter(p=>p&&inRound(p)&&Array.isArray(p.picks)).map(p=>({name:p.nick||"Castaway",picks:p.picks}));
  app.innerHTML=`<div class="panel results">${resultsHTML(entries)}
    <div class="row" style="justify-content:space-between;margin-top:20px">
      <button class="btn sec" id="cp">📋 Copy summary</button>
      ${isHost()?`<div class="row"><button class="btn sec" id="rbk">← Gallery</button><button class="btn sec" id="again">New round 🔁</button><button class="btn" id="teamup">Team up 🤝</button></div>`:`<span class="muted">Next up: the host can team you up, throw a twist or start a new round.</span>`}
    </div>
    ${isHost()?`<div class="hostbar">${twistPickerHTML().replace('Pick one to spring on the group','Everyone sees it on their screen. Pick one')}</div>`:''}</div>`;
  animateBars();play("fanfare",200);
  $("#cp").onclick=()=>copyText(summaryText(entries),"Copied! Paste it into your chat or notes.");
  if(isHost()){
    bindTwists(i=>gset({twist:{i,ts:Date.now()}}));
    $("#again").onclick=()=>gset({phase:"lobby",round:g.round+1,order:[],turn:0,twist:null,thinkEnd:0,teams:[],spot:-1});
    $("#rbk").onclick=()=>gset({phase:"gallery",spot:-1});
    $("#teamup").onclick=()=>gset({phase:"teams",teams:(g.teams||[]),keepPair:g.keepPair||3,keepTrio:g.keepTrio||4});
  }
}
const oEntries=()=>{const g=O.game;return (g.order||[]).map(id=>O.players.find(p=>p.id===id)).filter(p=>p&&inRound(p)&&Array.isArray(p.picks)&&p.picks.length).map(p=>({id:p.id,name:p.nick||"Castaway",picks:p.picks}))};
const oById=()=>Object.fromEntries(oEntries().map(e=>[e.id,e]));
function oGallery(){
  const g=O.game,entries=oEntries();
  app.innerHTML=`<div class="panel">${galleryHTML(entries,g.spot,isHost())}
    ${hostOnly(`<div class="row" style="justify-content:space-between"><button class="btn sec sm" id="gb">← Back to share round</button><div class="row"><button class="btn sec" id="gs">🎤 Start the spotlight</button><button class="btn" id="gn">See the patterns 📊</button></div></div>`)}</div>`;
  const nav=i=>gset({spot:i});
  if(isHost()){app.querySelectorAll("[data-gi]").forEach(c=>c.onclick=()=>nav(+c.dataset.gi));$("#gs").onclick=()=>nav(0);
    $("#gb").onclick=()=>gset({phase:"share",turn:Math.max(0,(g.order||[]).length-1),spot:-1});$("#gn").onclick=()=>gset({phase:"results",spot:-1})}
  if(g.spot>=0)showSpot(entries,g.spot,isHost(),nav);else hideSpot();
}
function oTeams(){
  const g=O.game,players=oEntries(),byId=oById(),teams=g.teams||[];
  if(isHost()){
    app.innerHTML=`<div class="panel">${teamsBuilderHTML(players,teams,g.keepPair||3,g.keepTrio||4)}
      <div class="row" style="justify-content:space-between;margin-top:16px"><button class="btn sec" id="tb">← Patterns</button><button class="btn" id="tgo" ${teamsReady(players,teams)?'':'disabled'}>Start the team challenge 🎒</button></div></div>`;
    bindTeamsBuilder(players,{teams,keepPair:g.keepPair||3,keepTrio:g.keepTrio||4},patch=>gset(patch),()=>{O.viewKey="";renderOnline()});
    $("#tb").onclick=()=>gset({phase:"results"});
    $("#tgo").onclick=()=>gset({phase:"teamkeep",teams:teams.map(t=>({members:t.members,keep:[],done:false}))});
  }else{
    const mine=teams.findIndex(t=>t.members.includes(NET.me));
    app.innerHTML=`<div class="panel center"><h2 style="margin-top:0">🤝 Teaming up…</h2>
      <p class="muted">You're not alone after all! The host is putting castaways into teams. Each team will pool its items — but can only keep a few.</p>
      ${mine>=0?`<div class="yourturn" style="animation:none">You're in <b>${teamName(mine)}</b> with ${teams[mine].members.filter(m=>m!==NET.me).map(m=>esc(nameOf(byId,m))).join(" & ")||"…waiting for a partner"}</div>`:''}
      <div class="tgrid" style="text-align:left">${teams.map((t,i)=>`<div class="tcard"><div class="tname">${teamName(i)}</div>${t.members.map(m=>`<span class="pchip in ro">${esc(nameOf(byId,m))}</span>`).join("")}</div>`).join("")||'<p class="muted">No teams yet…</p>'}</div></div>`;
  }
}
function oTeamKeep(){
  const g=O.game,byId=oById(),teams=g.teams||[],lim=t=>teamLimit(t,byId,g.keepPair||3,g.keepTrio||4);
  const mine=teams.findIndex(t=>t.members.includes(NET.me));const done=teams.filter(t=>t.done).length;
  const order=teams.map((t,i)=>i).sort((a,b)=>(b===mine)-(a===mine));
  app.innerHTML=`<div class="panel"><h2 style="margin-top:0">🎒 What does your team keep?</h2>
    <p class="muted" style="margin-top:0">Talk it over with your teammates. Pairs keep ${g.keepPair||3} items, teams of 3 keep ${g.keepTrio||4}. Anyone in the team can tap — you'll all see the same choices.</p>
    <div class="tprog">${done} of ${teams.length} teams done</div>
    ${order.map(i=>teamKeepHTML(teams[i],i,byId,lim(teams[i]),isHost()||i===mine,i===mine)).join("")}
    ${hostOnly(`<div class="row" style="justify-content:space-between"><button class="btn sec sm" id="kb">← Teams</button><button class="btn" id="kgo">Reveal the team islands 🏝️</button></div><div class="muted small" style="margin-top:6px">As host you can also pick for any team.</div>`)}</div>`;
  bindTeamKeep(teams,byId,lim,(i,keep)=>act({t:"teamkeep",ti:i,keep}),(i,d)=>act({t:"teamdone",ti:i,done:d}));
  if(isHost()){$("#kb").onclick=()=>gset({phase:"teams"});$("#kgo").onclick=()=>gset({phase:"teamreveal"})}
}
function oTeamReveal(){
  const g=O.game,byId=oById(),teams=g.teams||[];
  app.innerHTML=`<div class="panel results">${teamRevealHTML(teams,byId)}
    <div class="row" style="justify-content:space-between;margin-top:20px"><button class="btn sec" id="rcp">📋 Copy summary</button>
      ${isHost()?`<div class="row"><button class="btn sec" id="rb">← Back</button><button class="btn" id="again">New round 🔁</button></div>`:''}</div>
    ${isHost()?`<div class="hostbar">${twistPickerHTML().replace('Pick one to spring on the group','Everyone sees it on their screen. Pick one')}</div>`:''}</div>`;
  play("fanfare",200);
  $("#rcp").onclick=()=>copyText(teamSummary(teams,byId),"Copied!");
  if(isHost()){bindTwists(i=>gset({twist:{i,ts:Date.now()}}));$("#rb").onclick=()=>gset({phase:"teamkeep"});
    $("#again").onclick=()=>gset({phase:"lobby",round:g.round+1,order:[],turn:0,twist:null,thinkEnd:0,teams:[],spot:-1})}
}

/* ---------- boot ---------- */
home(true);
(()=>{
  if(typeof Peer==="undefined"){NET.status="off";if(app.querySelector(".homecards"))home(true);return}
  NET.status="ready";
  const code=INIT_HASH,nick=store.get("np0-nick");
  if(/^[A-Z0-9]{4,6}$/.test(code)){
    const saved=parse(store.get("np0-host-"+code));
    if(saved&&saved.game&&saved.game.host===NET.me){HS=saved;Object.values(HS.players).forEach(p=>{if(p!==HS.players[NET.me])p.online=false});startHost(code,false);return}
    joinAsPlayer(code,nick||"");return;
  }
  home(true);
})();
</script>
